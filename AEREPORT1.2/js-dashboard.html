<script>
  /**
   * ============================================================================
   * SISTEM REPORT PEKERJAAN AUTO ELECTRICIAN - PT. SAMUDERA MULIA ABADI (KONAWE)
   * File: js-dashboard.html (KPI Dashboard, Visualisasi Chart.js, & 11 Metrik PDF)
   * ============================================================================
   */

  if (typeof parseDateComponents !== 'function') {
    window.parseDateComponents = function (dateStr) {
      if (!dateStr) return null;
      if (dateStr instanceof Date) {
        if (isNaN(dateStr.getTime())) return null;
        return { year: dateStr.getFullYear(), month: dateStr.getMonth() + 1, day: dateStr.getDate() };
      }
      var str = String(dateStr).trim();
      if (!str || str === '-' || str === 'undefined' || str === 'null') return null;
      str = str.replace(/^[a-zA-Z]+,\s*/, '');
      var monthMap = {
        'jan': 1, 'januari': 1, 'january': 1,
        'feb': 2, 'februari': 2, 'february': 2,
        'mar': 3, 'maret': 3, 'march': 3,
        'apr': 4, 'april': 4,
        'mei': 5, 'may': 5,
        'jun': 6, 'juni': 6, 'june': 6,
        'jul': 7, 'juli': 7, 'july': 7,
        'agu': 8, 'agust': 8, 'agustus': 8, 'aug': 8, 'august': 8,
        'sep': 9, 'sept': 9, 'september': 9,
        'okt': 10, 'oktober': 10, 'oct': 10, 'october': 10,
        'nov': 11, 'november': 11,
        'des': 12, 'desember': 12, 'dec': 12, 'december': 12
      };
      var textMonthMatch = str.match(/(\d{1,2})[\s\-_/]+([a-zA-Z]+)[\s\-_/]+(\d{2,4})/);
      if (textMonthMatch) {
        var dTxt = parseInt(textMonthMatch[1], 10);
        var mKey = textMonthMatch[2].toLowerCase();
        var yTxt = parseInt(textMonthMatch[3], 10);
        if (yTxt < 100) yTxt = 2000 + yTxt;
        if (monthMap[mKey]) return { year: yTxt, month: monthMap[mKey], day: dTxt };
      }
      var dateOnly = str.split(/[T\s]/)[0];
      var parts = dateOnly.split(/[-/.]/);
      if (parts.length >= 3) {
        var p0 = parseInt(parts[0], 10);
        var p1 = parseInt(parts[1], 10);
        var p2 = parseInt(parts[2], 10);
        if (parts[0].length === 4) return { year: p0, month: p1, day: p2 };
        if (parts[2].length === 4) return { year: p2, month: p1, day: p0 };
        if (parts[2].length === 2) return { year: 2000 + p2, month: p1, day: p0 };
      }
      var d = new Date(str);
      if (!isNaN(d.getTime())) return { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() };
      return null;
    };
  }

  window.isDateInSelectedPeriod = function (dateStr, targetMonth, targetYear) {
    if (!dateStr) return false;
    var parsed = parseDateComponents(dateStr);
    if (!parsed) return false;
    var isAllMonth = (targetMonth === 'all' || targetMonth === 'ALL' || targetMonth === '' || targetMonth === null || typeof targetMonth === 'undefined');
    var isAllYear = (targetYear === 'all' || targetYear === 'ALL' || targetYear === '' || targetYear === null || typeof targetYear === 'undefined');
    var tM = isAllMonth ? null : parseInt(targetMonth, 10);
    var tY = isAllYear ? null : parseInt(targetYear, 10);
    if (!isAllMonth && (isNaN(tM) || tM <= 0)) isAllMonth = true;
    if (!isAllYear && (isNaN(tY) || tY <= 0)) isAllYear = true;
    if (!isAllYear && parsed.year !== tY) return false;
    if (!isAllMonth && parsed.month !== tM) return false;
    return true;
  };

  var currentActiveMetricType = 'pa';

  function getChartActiveLabels(chart, defaultLabels) {
    if (!chart || !chart.data || !chart.data.labels) return (defaultLabels || []).slice();
    var active = [];
    for (var i = 0; i < chart.data.labels.length; i++) {
      var isVis = (typeof chart.getDataVisibility === 'function') ? chart.getDataVisibility(i) : true;
      if (isVis) {
        active.push(chart.data.labels[i]);
      }
    }
    return active;
  }

  function handleChartElementSoloClick(chart, clickedIdx, onUpdateCallback) {
    if (!chart || !chart.data || !chart.data.labels) return;
    var total = chart.data.labels.length;
    var visibleIndices = [];
    for (var i = 0; i < total; i++) {
      var isVis = (typeof chart.getDataVisibility === 'function') ? chart.getDataVisibility(i) : true;
      if (isVis) visibleIndices.push(i);
    }
    // Jika hanya elemen clickedIdx yang saat ini aktif -> Reset semua menjadi aktif kembali
    if (visibleIndices.length === 1 && visibleIndices[0] === clickedIdx) {
      for (var j = 0; j < total; j++) {
        if (typeof chart.getDataVisibility === 'function' && !chart.getDataVisibility(j)) {
          chart.toggleDataVisibility(j);
        }
      }
    } else {
      // Isolasi hanya elemen clickedIdx (sembunyikan lainnya)
      for (var k = 0; k < total; k++) {
        var wantVis = (k === clickedIdx);
        var curVis = (typeof chart.getDataVisibility === 'function') ? chart.getDataVisibility(k) : true;
        if (curVis !== wantVis && typeof chart.toggleDataVisibility === 'function') {
          chart.toggleDataVisibility(k);
        }
      }
    }
    chart.update();
    if (typeof onUpdateCallback === 'function') {
      onUpdateCallback();
    }
  }

  function getDashboardSourceReports() {
    if (window.globalAllWorkReports && Array.isArray(window.globalAllWorkReports) && window.globalAllWorkReports.length > 0) {
      return window.globalAllWorkReports;
    }
    return (typeof allFilteredReports !== 'undefined' && Array.isArray(allFilteredReports) && allFilteredReports.length > 0)
      ? allFilteredReports
      : [];
  }
  window.getDashboardSourceReports = getDashboardSourceReports;

  function fetchDashboardWorkReports(forceRefresh, callback) {
    if (!forceRefresh && window.globalAllWorkReports && window.globalAllWorkReports.length > 0) {
      if (callback) callback(window.globalAllWorkReports);
      return;
    }
    if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.getWorkReportsPaginated === 'function') {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success && res.reports) {
            window.globalAllWorkReports = res.reports;
            if (typeof allFilteredReports === 'undefined' || !allFilteredReports || allFilteredReports.length === 0) {
              allFilteredReports = res.reports;
            }
            if (typeof loadDashboardKPI === 'function') {
              loadDashboardKPI(true);
            }
            if (callback) callback(window.globalAllWorkReports);
          } else {
            if (callback) callback(getDashboardSourceReports());
          }
        })
        .withFailureHandler(function (err) {
          console.warn('Gagal memuat seluruh log pekerjaan dashboard:', err);
          if (callback) callback(getDashboardSourceReports());
        })
        .getWorkReportsPaginated(1, 1000, '', '');
    } else {
      if (callback) callback(getDashboardSourceReports());
    }
  }
  window.fetchDashboardWorkReports = fetchDashboardWorkReports;

  function fetchAllDashboardData(forceRefresh, callback) {
    var pending = 0;
    function checkDone() {
      pending--;
      if (pending <= 0) {
        if (typeof loadDashboardKPI === 'function') {
          loadDashboardKPI(true);
        }
        if (typeof callback === 'function') callback();
      }
    }

    // 1. Log Pekerjaan
    if (forceRefresh || !window.globalAllWorkReports || window.globalAllWorkReports.length === 0) {
      pending++;
      fetchDashboardWorkReports(forceRefresh, function () {
        checkDone();
      });
    }

    // 2. Log Baterai
    if ((forceRefresh || !globalBatteryLogs || globalBatteryLogs.length === 0) && typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.getBatteryLogs === 'function') {
      pending++;
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success && res.logs) {
            globalBatteryLogs = res.logs;
          }
          checkDone();
        })
        .withFailureHandler(function (err) {
          console.warn('Gagal memuat log baterai untuk dashboard:', err);
          checkDone();
        })
        .getBatteryLogs();
    }

    // 3. Log PM
    if ((forceRefresh || !globalPMLogs || globalPMLogs.length === 0) && typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.getPMLogs === 'function') {
      pending++;
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success && res.logs) {
            globalPMLogs = res.logs;
          }
          checkDone();
        })
        .withFailureHandler(function (err) {
          console.warn('Gagal memuat log PM untuk dashboard:', err);
          checkDone();
        })
        .getPMLogs();
    }

    // 4. Log Inspeksi
    if ((forceRefresh || !globalInspectionLogs || globalInspectionLogs.length === 0) && typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.getInspectionLogs === 'function') {
      pending++;
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success && res.logs) {
            globalInspectionLogs = res.logs;
          }
          checkDone();
        })
        .withFailureHandler(function (err) {
          console.warn('Gagal memuat log inspeksi untuk dashboard:', err);
          checkDone();
        })
        .getInspectionLogs();
    }

    // 5. Log Breakdown
    if ((forceRefresh || !globalBreakdownLogs || globalBreakdownLogs.length === 0) && typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.getBreakdownLogs === 'function') {
      pending++;
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success && res.logs) {
            globalBreakdownLogs = res.logs;
          }
          checkDone();
        })
        .withFailureHandler(function (err) {
          console.warn('Gagal memuat log breakdown untuk dashboard:', err);
          checkDone();
        })
        .getBreakdownLogs();
    }

    if (pending === 0) {
      if (typeof callback === 'function') callback();
    }
  }
  window.fetchAllDashboardData = fetchAllDashboardData;

  function openDashboardMetricModal(metricType) {
    currentActiveMetricType = metricType;
    var modal = document.getElementById('dashMetricChartModal');
    if (!modal) return;

    var selM = document.getElementById('dashMonth') ? document.getElementById('dashMonth').value : String(new Date().getMonth() + 1);
    var selY = document.getElementById('dashYear') ? document.getElementById('dashYear').value : String(new Date().getFullYear());

    var sourceReports = getDashboardSourceReports();

    // Pastikan seluruh data log pekerjaan termuat lengkap dari server jika belum ada di memori
    var workReportMetrics = ['total_jobs', 'pa', 'mttr', 'mtbf', 'top_category', 'matrix_system', 'matrix_recurring', 'part_ratio'];
    if ((!sourceReports || sourceReports.length === 0) && workReportMetrics.indexOf(metricType) !== -1 && typeof fetchDashboardWorkReports === 'function') {
      var tbodyLoading = document.getElementById('dashMetricTableTbody');
      if (tbodyLoading) {
        tbodyLoading.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:35px; color:#64748b; font-size:13px;"><svg class="spin-icon-dash" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle; margin-right:8px;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> Sedang mengambil seluruh data riwayat pekerjaan periode terpilih...</td></tr>';
      }
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      fetchDashboardWorkReports(false, function () {
        openDashboardMetricModal(metricType);
      });
      return;
    }

    var periodReports = sourceReports.filter(function (r) {
      return isDateInSelectedPeriod(r.tanggal || r.timestamp, selM, selY);
    });
    if (typeof sortListByDateDescending === 'function') {
      periodReports = sortListByDateDescending(periodReports, 'tanggal');
    }

    var isAllM = (selM === 'all' || selM === 'ALL' || !selM);
    var isAllY = (selY === 'all' || selY === 'ALL' || !selY);
    var monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    var mInt = parseInt(selM, 10);
    var mText = (!isAllM && mInt >= 1 && mInt <= 12) ? monthNames[mInt - 1] : 'Semua Bulan';
    var periodLabel = (isAllM && isAllY)
      ? 'Seluruh Periode (Kumulatif)'
      : (isAllM ? ('Semua Bulan ' + selY) : (isAllY ? (mText + ' (Semua Tahun)') : (mText + ' ' + selY)));

    var titleEl = document.getElementById('dashMetricModalTitle');
    var subEl = document.getElementById('dashMetricModalSubtitle');
    var badgeEl = document.getElementById('dashMetricModalBadge');
    var statBar = document.getElementById('dashMetricModalStatBar');
    var headingEl = document.getElementById('dashMetricChartHeading');
    var subnoteEl = document.getElementById('dashMetricChartSubnote');
    var tblHeading = document.getElementById('dashMetricTableHeading');
    var thead = document.getElementById('dashMetricTableThead');
    var tbody = document.getElementById('dashMetricTableTbody');

    if (dashMetricChartInstance) {
      dashMetricChartInstance.destroy();
      dashMetricChartInstance = null;
    }

    var chartConfig = null;

    if (metricType === 'pa') {
      titleEl.textContent = 'PHYSICAL AVAILABILITY (PA)';
      subEl.textContent = 'Tingkat kesiapan mekanikal armada tambang beroperasi normal di Site Konawe (' + periodLabel + ')';
      badgeEl.textContent = 'TARGET: ≥ 90.0%';
      headingEl.textContent = 'TREN AVAILABILITY PER MODEL ARMADA';
      subnoteEl.textContent = 'Persentase PA dihitung dari Total Jam Operasi terhadap Downtime Elektrikal (Klik batang grafik untuk memfilter)';
      tblHeading.textContent = 'MATRIKS KESIAPAN UNIT PER MODEL / KLASIFIKASI';

      var totalDt = periodReports.reduce(function (acc, r) { return acc + (parseFloat(r.downtimeJam) || 0); }, 0);
      var unitCount = (globalUnits && globalUnits.length > 0) ? globalUnits.length : 10;
      var totalOpHours = unitCount * 30 * 24;
      var paRaw = totalOpHours > 0 ? (((totalOpHours - totalDt) / totalOpHours) * 100) : 100;
      if (paRaw < 0) paRaw = 0;
      if (paRaw > 100) paRaw = 100;
      var paVal = (paRaw % 1 === 0 || paRaw >= 100) ? Math.round(paRaw).toString() : parseFloat(paRaw.toFixed(1)).toString();

      statBar.innerHTML = '<div class="dash-stat-pill">Akumulasi PA: <strong style="color: #34d399; font-size:14px;">' + paVal + '%</strong></div>' +
        '<div class="dash-stat-pill">Total Unit Terdaftar: <strong>' + unitCount + ' Unit</strong></div>' +
        '<div class="dash-stat-pill">Total Downtime Elektrikal: <strong>' + totalDt.toFixed(1) + ' Jam</strong></div>';

      var modelMap = {};
      globalUnits.forEach(function (u) {
        var m = u.model || 'LAINNYA';
        if (!modelMap[m]) modelMap[m] = { count: 0, dt: 0, reports: 0 };
        modelMap[m].count++;
      });
      periodReports.forEach(function (r) {
        var uObj = globalUnits.find(function (x) { return x.noUnit === r.noUnit; });
        var m = (uObj && uObj.model) ? uObj.model : (r.modelUnit || 'LAINNYA');
        if (!modelMap[m]) modelMap[m] = { count: 1, dt: 0, reports: 0 };
        modelMap[m].dt += (parseFloat(r.downtimeJam) || 0);
        modelMap[m].reports++;
      });

      var labels = Object.keys(modelMap);
      var dataPA = labels.map(function (lbl) {
        var itm = modelMap[lbl];
        var opH = itm.count * 30 * 24;
        var p = opH > 0 ? (((opH - itm.dt) / opH) * 100).toFixed(1) : 100;
        return parseFloat(p);
      });

      var activeModelFilterPA = null;

      function renderPAFilteredTable() {
        var filteredLabels = labels;
        if (activeModelFilterPA) {
          filteredLabels = labels.filter(function (lbl) { return lbl === activeModelFilterPA; });
          tblHeading.innerHTML = 'MATRIKS KESIAPAN MODEL TERFILTER: <strong style="color:var(--accent-orange);">' + escapeHtml(activeModelFilterPA) + '</strong> <button type="button" onclick="window._resetPAFilter()" style="margin-left:8px; font-size:10.5px; padding:2px 8px; border-radius:4px; background:#f1f5f9; border:1px solid #cbd5e1; cursor:pointer; color:#0f172a; font-weight:700;">Tampilkan Semua</button>';
        } else {
          tblHeading.textContent = 'MATRIKS KESIAPAN UNIT PER MODEL / KLASIFIKASI (' + labels.length + ' Model)';
        }
        var rowsHtml = '';
        filteredLabels.forEach(function (lbl, idx) {
          var itm = modelMap[lbl];
          var opH = itm.count * 30 * 24;
          var pRaw = opH > 0 ? (((opH - itm.dt) / opH) * 100) : 100;
          if (pRaw < 0) pRaw = 0;
          if (pRaw > 100) pRaw = 100;
          var p = (pRaw % 1 === 0 || pRaw >= 100) ? Math.round(pRaw).toString() : parseFloat(pRaw.toFixed(1)).toString();
          var statusPill = pRaw >= 90
            ? '<span class="dash-status-pill-rfu">PRIME (≥90%)</span>'
            : '<span class="dash-status-pill-waiting">UNDER TARGET</span>';
          rowsHtml += '<tr><td style="text-align:center; color:#64748b; font-weight:600;">' + (idx + 1) + '</td><td><strong style="color:#0f172a; font-weight:800;">' + escapeHtml(lbl) + '</strong></td><td style="text-align:center; font-weight:600;">' + itm.count + ' Unit</td><td style="text-align:center; font-weight:600;">' + itm.reports + ' Kali</td><td style="text-align:center; font-weight:800; color:#0f172a;">' + itm.dt.toFixed(1) + ' Jam</td><td style="text-align:center; font-weight:800; color:#059669;">' + p + '%</td><td style="text-align:center;">' + statusPill + '</td></tr>';
        });
        tbody.innerHTML = rowsHtml;
      }

      window._resetPAFilter = function () {
        activeModelFilterPA = null;
        renderPAFilteredTable();
      };

      chartConfig = {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Physical Availability (%)',
            data: dataPA,
            backgroundColor: 'rgba(16, 185, 129, 0.75)',
            borderColor: '#10b981',
            borderWidth: 1.5,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          onClick: function (evt, elements) {
            if (elements && elements.length > 0) {
              var clickedIdx = elements[0].index;
              var targetModel = labels[clickedIdx];
              activeModelFilterPA = (activeModelFilterPA === targetModel) ? null : targetModel;
              renderPAFilteredTable();
            }
          },
          scales: {
            y: { min: 50, max: 100, ticks: { color: '#334155', font: { weight: '600', size: 11 } }, grid: { color: 'rgba(0,0,0,0.06)' } },
            x: { ticks: { color: '#0f172a', font: { weight: '700', size: 10.5 }, maxRotation: 45, minRotation: 45, autoSkip: false }, grid: { display: false } }
          }
        }
      };

      thead.innerHTML = '<tr><th style="width:45px; text-align:center;">NO</th><th>MODEL ARMADA</th><th style="text-align:center;">POPULASI</th><th style="text-align:center;">KASUS</th><th style="text-align:center;">DOWNTIME</th><th style="text-align:center;">PHYSICAL AVAILABILITY</th><th style="text-align:center;">STATUS</th></tr>';
      renderPAFilteredTable();

    } else if (metricType === 'mttr') {
      titleEl.textContent = 'MEAN TIME TO REPAIR (MTTR)';
      subEl.textContent = 'Efisiensi dan kecepatan durasi penanganan kerusakan sistem elektrikal (' + periodLabel + ')';
      badgeEl.textContent = 'WAKTU REPARASI';
      headingEl.textContent = 'DURASI RATA-RATA REPARASI PER KATEGORI (JAM)';
      subnoteEl.textContent = 'MTTR = Total Downtime Dibagi Jumlah Kasus Pekerjaan (Klik batang grafik untuk memfilter)';
      tblHeading.textContent = 'MATRIKS DURASI PERBAIKAN PER KATEGORI KERUSAKAN';

      var catMap = {};
      periodReports.forEach(function (r) {
        var c = (typeof normalizeCategoryName === 'function')
          ? normalizeCategoryName(r.kategoriPekerjaan)
          : String(r.kategoriPekerjaan || 'LAIN-LAIN').trim().toUpperCase();
        if (!catMap[c]) catMap[c] = { cases: 0, dt: 0 };
        catMap[c].cases++;
        catMap[c].dt += (parseFloat(r.downtimeJam) || 0);
      });

      var totalCases = periodReports.length;
      var totalDtAll = periodReports.reduce(function (acc, r) { return acc + (parseFloat(r.downtimeJam) || 0); }, 0);
      var avgMttr = totalCases > 0 ? (totalDtAll / totalCases).toFixed(1) : '0.0';

      statBar.innerHTML = '<div class="dash-stat-pill">Rata-Rata MTTR: <strong style="color: var(--accent-orange); font-size:14px;">' + avgMttr + ' Jam</strong></div>' +
        '<div class="dash-stat-pill">Total Intervensi: <strong>' + totalCases + ' Pekerjaan</strong></div>' +
        '<div class="dash-stat-pill">Akumulasi Downtime: <strong>' + totalDtAll.toFixed(1) + ' Jam</strong></div>';

      var labels = Object.keys(catMap);
      var dataMttr = labels.map(function (k) {
        var itm = catMap[k];
        return itm.cases > 0 ? parseFloat((itm.dt / itm.cases).toFixed(1)) : 0;
      });

      var activeCatFilterMTTR = null;

      function renderMTTRFilteredTable() {
        var filteredLabels = labels;
        if (activeCatFilterMTTR) {
          filteredLabels = labels.filter(function (k) { return k === activeCatFilterMTTR; });
          tblHeading.innerHTML = 'MATRIKS DURASI TERFILTER: <strong style="color:var(--accent-orange);">' + escapeHtml(activeCatFilterMTTR) + '</strong> <button type="button" onclick="window._resetMTTRFilter()" style="margin-left:8px; font-size:10.5px; padding:2px 8px; border-radius:4px; background:#f1f5f9; border:1px solid #cbd5e1; cursor:pointer; color:#0f172a; font-weight:700;">Tampilkan Semua</button>';
        } else {
          tblHeading.textContent = 'MATRIKS DURASI PERBAIKAN PER KATEGORI KERUSAKAN (' + labels.length + ' Kategori)';
        }
        var rowsHtml = '';
        filteredLabels.forEach(function (k, idx) {
          var itm = catMap[k];
          var m = itm.cases > 0 ? (itm.dt / itm.cases).toFixed(1) : '0.0';
          var evalPill = parseFloat(m) <= 2.5
            ? '<span class="dash-status-pill-rfu">CEPAT (≤2.5 Jam)</span>'
            : '<span class="dash-status-pill-waiting">LAMBAT (>2.5 Jam)</span>';
          rowsHtml += '<tr><td style="text-align:center; color:#64748b; font-weight:600;">' + (idx + 1) + '</td><td><strong style="color:#0f172a; font-weight:800;">' + escapeHtml(k) + '</strong></td><td style="text-align:center; font-weight:600;">' + itm.cases + ' Kasus</td><td style="text-align:center; font-weight:800; color:#0f172a;">' + itm.dt.toFixed(1) + ' Jam</td><td style="text-align:center; font-weight:800; color:#d97706;">' + m + ' Jam</td><td style="text-align:center;">' + evalPill + '</td></tr>';
        });
        tbody.innerHTML = rowsHtml || '<tr><td colspan="6" style="text-align:center; padding:20px; color:#64748b;">Belum ada data pekerjaan di periode ini.</td></tr>';
      }

      window._resetMTTRFilter = function () {
        activeCatFilterMTTR = null;
        renderMTTRFilteredTable();
      };

      chartConfig = {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'MTTR (Jam)',
            data: dataMttr,

    host.style.cssText = 'position: fixed; left: 0; top: 0; width: 720px; min-width: 720px; max-width: 720px; height: auto; z-index: 1000; background: #ffffff; margin: 0; padding: 0; box-sizing: border-box; overflow: visible; pointer-events: none;';

    var clone = template.cloneNode(true);
    clone.id = 'dashActivePrintTargetNode';
    clone.classList.add('pdf-print-template-root');
    clone.style.cssText = 'display: block !important; position: relative !important; width: 720px !important; min-width: 720px !important; max-width: 720px !important; margin: 0 !important; left: 0 !important; background: #ffffff !important; opacity: 1 !important; visibility: visible !important; box-sizing: border-box !important;';

    host.appendChild(clone);

    var isCleaned = false;

      if (isCleaned) return;

      if (typeof hidePdfRenderOverlay === 'function') {
        hidePdfRenderOverlay();
      }
      if (host && host.parentNode) {
        host.parentNode.removeChild(host);
      }
    }

    var safetyTimer = setTimeout(function () {
      if (!isCleaned) {
        cleanupHost();
        restoreBtnUI(false);
        showToast('Waktu proses cetak Dashboard habis.', 'error');
      }
    }, 15000);

    waitForImagesLoaded(clone, function () {
      setTimeout(function () {
        if (typeof window.scrollTo === 'function') {
          window.scrollTo(0, 0);
        }
        var fileSuffix = isYearly ? ('TAHUNAN_' + selY) : ('BULANAN_' + selY + '_' + ('0' + selM).slice(-2));
        var opt = {
          margin: [8, 8, 8, 8],
          filename: 'REKAP_DASHBOARD_AE_' + fileSuffix + '_' + new Date().toISOString().slice(0, 10) + '.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: {
            scale: 3,
            dpi: 300,
            letterRendering: true,
            useCORS: true,
            allowTaint: false,
            scrollY: 0,
            scrollX: 0,
            x: 0,
            y: 0,
            windowWidth: 720,
            backgroundColor: '#ffffff',
            logging: false
          },
          pagebreak: {
            mode: ['avoid-all', 'css', 'legacy'],
            avoid: ['tr', 'table', '.far-signature-table', '.pdf-avoid-break', 'img']
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true }
        };

        try {
          if (typeof html2pdf !== 'undefined') {
            html2pdf().set(opt).from(clone).save().then(function () {
              clearTimeout(safetyTimer);
              cleanupHost();
              restoreBtnUI(true);
            }).catch(function (err) {
              clearTimeout(safetyTimer);
              cleanupHost();
              restoreBtnUI(false);
              showToast('Gagal mencetak PDF Dashboard: ' + err.message, 'error');
            });
          } else {
            clearTimeout(safetyTimer);
            cleanupHost();
            restoreBtnUI(false);
            showToast('Library html2pdf belum siap dimuat.', 'error');
          }
        } catch (execErr) {
          clearTimeout(safetyTimer);
          cleanupHost();
          restoreBtnUI(false);
          showToast('Terjadi kendala saat memproses PDF: ' + execErr.message, 'error');
        }
      }, 150);
    });
  }

  /**
   * FITUR CETAK DOKUMEN ANALISIS METRIK KHUSUS (11 KARTU METRIK) + GRAFIK LOSSLESS & TABEL KASUS
   * Dilengkapi penguncian koordinat kanvas absolut anti-shift (Desktop & Mobile)
   */
  function downloadMetricModalPDF() {
    var btn = document.getElementById('btnDownloadMetricModalPdf');
    var origBtnHtml = btn ? btn.innerHTML : '';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<svg class="spin-icon-dash" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> Mengunduh PDF...';
    }

    function restoreBtnUI(isSuccess) {
      if (!btn) return;
      if (isSuccess) {
        btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg> Selesai';
        setTimeout(function () {
          btn.disabled = false;
          btn.innerHTML = origBtnHtml;
        }, 600);
      } else {
        btn.disabled = false;
        btn.innerHTML = origBtnHtml;
      }
    }

    if (typeof showPdfRenderOverlay === 'function') {
      showPdfRenderOverlay('Menyiapkan Analisis Metrik...', 'Sedang merender laporan analisis metrik & grafik resolusi tinggi...');
    }

    var printTemplate = document.getElementById('metricSinglePrintTemplate');
    if (!printTemplate) {
      if (typeof hidePdfRenderOverlay === 'function') hidePdfRenderOverlay();
      restoreBtnUI(false);
      showToast('Template cetak analisis metrik tidak ditemukan!', 'error');
      return;
    }

    var selM = document.getElementById('dashMonth') ? parseInt(document.getElementById('dashMonth').value, 10) : (new Date().getMonth() + 1);
    var selY = document.getElementById('dashYear') ? parseInt(document.getElementById('dashYear').value, 10) : new Date().getFullYear();
    var monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    var periodLabel = monthNames[selM - 1] + ' ' + selY;

    var printDateStr = formatDateDDMMYYYY(new Date());

    // 1. Sinkronisasi Logo Kop Surat
    var metricPdfLogo = document.getElementById('metricPdfCompanyLogo');
    var logoUrl = localStorage.getItem('AE_COMPANY_LOGO_URL') || '';
    if (metricPdfLogo && logoUrl) {
      metricPdfLogo.src = (typeof getDirectDriveImageUrl === 'function') ? getDirectDriveImageUrl(logoUrl) : logoUrl;
      metricPdfLogo.style.display = 'block';
    } else if (metricPdfLogo) {
      metricPdfLogo.style.display = 'none';
    }

    // 2. Salin Judul, Parameter, dan Badge dari Modal Aktif
    var modalTitleEl = document.getElementById('dashMetricModalTitle');
    var modalSubEl = document.getElementById('dashMetricModalSubtitle');
    var modalBadgeEl = document.getElementById('dashMetricModalBadge');
    var modalStatBar = document.getElementById('dashMetricModalStatBar');

    var pdfMainTitle = document.getElementById('metricPdfMainTitle');
    var pdfSubTitle = document.getElementById('metricPdfSubTitle');
    var pdfPeriod = document.getElementById('metricPdfPeriodLabel');
    var pdfDate = document.getElementById('metricPdfPrintDate');
    var pdfBadge = document.getElementById('metricPdfBadge');
    var pdfStatBar = document.getElementById('metricPdfStatBar');

    if (pdfMainTitle) pdfMainTitle.textContent = modalTitleEl ? modalTitleEl.textContent : 'LAPORAN ANALISIS METRIK KELISTRIKAN';
    if (pdfSubTitle) pdfSubTitle.textContent = modalSubEl ? modalSubEl.textContent : 'Electrical Diagnostic & Performance Metric Report';
    if (pdfPeriod) pdfPeriod.textContent = periodLabel;
    if (pdfDate) pdfDate.textContent = printDateStr;
    if (pdfBadge) pdfBadge.textContent = modalBadgeEl ? modalBadgeEl.textContent : '-';

    // Salin Baris Statistik Cepat dengan pembersihan warna putih kontras
    if (pdfStatBar && modalStatBar) {
      var cleanStatHtml = (modalStatBar.innerHTML || '')
        .replace(/color:\s*#ffffff/gi, 'color: #0f172a')
        .replace(/color:\s*#fff/gi, 'color: #0f172a');
      pdfStatBar.innerHTML = cleanStatHtml;
    }

    // 3. Salin Judul Heading Grafik
    var modalChartHead = document.getElementById('dashMetricChartHeading');
    var modalChartNote = document.getElementById('dashMetricChartSubnote');
    var pdfChartHead = document.getElementById('metricPdfChartHeading');
    var pdfChartNote = document.getElementById('metricPdfChartSubnote');

    if (pdfChartHead && modalChartHead) pdfChartHead.textContent = modalChartHead.textContent;
    if (pdfChartNote && modalChartNote) pdfChartNote.textContent = modalChartNote.textContent;

    // 4. Ekstrak Visualisasi Grafik Chart.js ke Gambar Lossless Super Jernih (PNG)
    var chartImg = document.getElementById('metricPdfChartImg');
    var chartCanvas = document.getElementById('dashMetricCanvas');
    if (chartImg && (dashMetricChartInstance || chartCanvas)) {
      try {
        var dataUrl = dashMetricChartInstance ? dashMetricChartInstance.toBase64Image('image/png', 1.0) : chartCanvas.toDataURL('image/png', 1.0);
        chartImg.src = dataUrl;
        chartImg.style.display = 'block';
      } catch (e) {
        console.warn('Gagal ekstrak chart ke gambar:', e);
      }
    }

    // 5. Salin Tabel Matriks Kasus Lengkap dengan Penyesuaian Kontras Gelap di Latar Putih
    var modalTableHead = document.getElementById('dashMetricTableHeading');
    var pdfTableHead = document.getElementById('metricPdfTableHeading');
    if (pdfTableHead && modalTableHead) pdfTableHead.textContent = modalTableHead.textContent;

    var modalThead = document.getElementById('dashMetricTableThead');
    var modalTbody = document.getElementById('dashMetricTableTbody');
    var pdfThead = document.getElementById('metricPdfTableThead');
    var pdfTbody = document.getElementById('metricPdfTableTbody');

    if (pdfThead && modalThead) {
      pdfThead.innerHTML = modalThead.innerHTML;
    }
    if (pdfTbody && modalTbody) {
      var cleanTbodyHtml = (modalTbody.innerHTML || '')
        .replace(/color:\s*#ffffff/gi, 'color: #0f172a')
        .replace(/color:\s*#fff/gi, 'color: #0f172a')
        .replace(/color:\s*rgb\(255,\s*255,\s*255\)/gi, 'color: #0f172a');
      pdfTbody.innerHTML = cleanTbodyHtml;
    }

    // Isolated In-Flow Host: Rendisi kanvas stabil, 100% presisi A4, tertutup rapi oleh rendering overlay
    var host = document.createElement('div');
    host.id = 'metricPdfCaptureHost';
    host.style.cssText = 'position: fixed; left: 0; top: 0; width: 720px; min-width: 720px; max-width: 720px; height: auto; z-index: 1000; background: #ffffff; margin: 0; padding: 0; box-sizing: border-box; overflow: visible; pointer-events: none;';

    var clone = printTemplate.cloneNode(true);
    clone.id = 'metricActivePrintTargetNode';
    clone.classList.add('pdf-print-template-root');
    clone.style.cssText = 'display: block !important; position: relative !important; width: 720px !important; min-width: 720px !important; max-width: 720px !important; margin: 0 !important; left: 0 !important; background: #ffffff !important; opacity: 1 !important; visibility: visible !important; box-sizing: border-box !important;';

    host.appendChild(clone);
    document.body.appendChild(host);

    var metricNameClean = (currentActiveMetricType || 'METRIK').toUpperCase().replace(/[^A-Z0-9_]/g, '_');

    var isCleaned = false;
    function cleanupHost() {
      if (isCleaned) return;
      isCleaned = true;
      if (typeof hidePdfRenderOverlay === 'function') {
        hidePdfRenderOverlay();
      }
      if (host && host.parentNode) {
        host.parentNode.removeChild(host);
      }
    }

    var safetyTimer = setTimeout(function () {
      if (!isCleaned) {
        cleanupHost();
        restoreBtnUI(false);
        showToast('Waktu proses cetak PDF Metrik habis.', 'error');
      }
    }, 15000);

    waitForImagesLoaded(clone, function () {
      setTimeout(function () {
        if (typeof window.scrollTo === 'function') {
          window.scrollTo(0, 0);
        }
        var opt = {
          margin: [8, 8, 8, 8],
          filename: 'ANALISIS_METRIK_' + metricNameClean + '_' + selY + '_' + ('0' + selM).slice(-2) + '_' + new Date().toISOString().slice(0, 10) + '.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: {
            scale: 3,
            dpi: 300,
            letterRendering: true,
            useCORS: true,
            allowTaint: false,
            scrollY: 0,
            scrollX: 0,
            x: 0,
            y: 0,
            windowWidth: 720,
            backgroundColor: '#ffffff',
            logging: false
          },
          pagebreak: {
            mode: ['avoid-all', 'css', 'legacy'],
            avoid: ['tr', 'table', '.far-signature-table', '.pdf-avoid-break', 'img']
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true }
        };

        try {
          if (typeof html2pdf !== 'undefined') {
            html2pdf().set(opt).from(clone).save().then(function () {
              clearTimeout(safetyTimer);
              cleanupHost();
              restoreBtnUI(true);
            }).catch(function (err) {
              clearTimeout(safetyTimer);
              cleanupHost();
              restoreBtnUI(false);
              showToast('Gagal mencetak PDF Metrik: ' + err.message, 'error');
            });
          } else {
            clearTimeout(safetyTimer);
            cleanupHost();
            restoreBtnUI(false);
            showToast('Library html2pdf belum siap dimuat.', 'error');
          }
        } catch (execErr) {
          clearTimeout(safetyTimer);
          cleanupHost();
          restoreBtnUI(false);
          showToast('Terjadi kendala saat memproses PDF Metrik: ' + execErr.message, 'error');
        }
      }, 150);
    });
  }
</script>
