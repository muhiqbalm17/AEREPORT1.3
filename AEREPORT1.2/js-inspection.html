<script>
  /**
   * ============================================================================
   * SISTEM REPORT PEKERJAAN AUTO ELECTRICIAN - PT. SAMUDERA MULIA ABADI (KONAWE)
   * File: js-inspection.html (Tab Checklist Inspeksi Elektrikal & Khusus AC System)
   * Versi: v3.0 (Sub-Tab Jadwal & Monitoring Prediktif, Klasifikasi Tipe Armada, & AC Module)
   * ============================================================================
   */

  var selectedInspectorsList = [];
  var selectedACInspectorsList = [];
  var currentInspectionUnitTypeFilter = 'ALL';
  var currentInspectionSystemFilter = 'ALL';
  var currentInspectionCardFilter = 'ALL';
  var currentInspectionSearchQuery = '';
  var globalInspectionScheduleData = [];

  // ============================================================================
  // 1. SUB-NAVIGASI & PENYELARASAN TAMPILAN
  // ============================================================================

  function switchInspectionSubTab(subTabId) {
    var btnSchedule = document.getElementById('subnav-insp-btn-schedule');
    var btnInput = document.getElementById('subnav-insp-btn-input');
    var panelSchedule = document.getElementById('insp-subtab-schedule');
    var panelInput = document.getElementById('insp-subtab-input');

    if (btnSchedule) btnSchedule.classList.toggle('active', subTabId === 'schedule');
    if (btnInput) btnInput.classList.toggle('active', subTabId === 'input');
    if (panelSchedule) panelSchedule.classList.toggle('active', subTabId === 'schedule');
    if (panelInput) panelInput.classList.toggle('active', subTabId === 'input');

    if (subTabId === 'schedule') {
      if (typeof renderNextInspectionScheduleTable === 'function') {
        renderNextInspectionScheduleTable();
      }
    }
  }
  window.switchInspectionSubTab = switchInspectionSubTab;

  function switchInspectionFormType(formType) {
    var btnElec = document.getElementById('inspFormToggle-elec');
    var btnAc = document.getElementById('inspFormToggle-ac');
    var formElec = document.getElementById('insp-form-container-elec');
    var formAc = document.getElementById('insp-form-container-ac');

    if (btnElec) btnElec.classList.toggle('active', formType === 'elec');
    if (btnAc) btnAc.classList.toggle('active', formType === 'ac');

    if (formElec) formElec.style.display = (formType === 'elec') ? 'block' : 'none';
    if (formAc) formAc.style.display = (formType === 'ac') ? 'block' : 'none';
  }
  window.switchInspectionFormType = switchInspectionFormType;

  // ============================================================================
  // 2. DETEKSI TIPE UNIT MASTER DATA PADA INPUT FORMULIR
  // ============================================================================

  function handleInspUnitInputChange(val) {
    var cleanVal = String(val || '').trim().toUpperCase();
    var badgeEl = document.getElementById('inspUnitTypeBadge');
    var hmInput = document.getElementById('inspHM');

    if (!cleanVal) {
      if (badgeEl) badgeEl.style.display = 'none';
      return;
    }

    var foundUnit = (window.globalUnits || []).find(function (u) {
      return String(u.noUnit || '').trim().toUpperCase() === cleanVal;
    });

    if (foundUnit) {
      var tipe = (typeof getUnitClassification === 'function')
        ? getUnitClassification(foundUnit)
        : (foundUnit.tipe || foundUnit.tipeUnit || 'HAULER');
      var model = foundUnit.model || '-';

      if (badgeEl) {
        badgeEl.textContent = 'TIPE: ' + tipe + ' (' + model + ')';
        badgeEl.style.display = 'inline-block';
      }

      if (hmInput && (!hmInput.value || parseFloat(hmInput.value) <= 0)) {
        var masterHM = parseFloat(foundUnit.hmTerakhir || foundUnit.HMTerakhir) || 0;
        if (masterHM > 0) hmInput.value = masterHM.toFixed(1);
      }
    } else {
      if (badgeEl) badgeEl.style.display = 'none';
    }
  }
  window.handleInspUnitInputChange = handleInspUnitInputChange;

  function handleInspAcUnitInputChange(val) {
    var cleanVal = String(val || '').trim().toUpperCase();
    var hmInput = document.getElementById('inspAcHM');
    if (!cleanVal) return;

    var foundUnit = (window.globalUnits || []).find(function (u) {
      return String(u.noUnit || '').trim().toUpperCase() === cleanVal;
    });

    if (foundUnit && hmInput && (!hmInput.value || parseFloat(hmInput.value) <= 0)) {
      var masterHM = parseFloat(foundUnit.hmTerakhir || foundUnit.HMTerakhir) || 0;
      if (masterHM > 0) hmInput.value = masterHM.toFixed(1);
    }
  }
  window.handleInspAcUnitInputChange = handleInspAcUnitInputChange;

  // ============================================================================
  // 3. MULTI-INSPEKTOR ELEKTRIKAL & KHUSUS AC
  // ============================================================================

  function handleInspectorInputKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      addSelectedInspectorFromInput();
    }
  }

  function handleInspectorInputDatalist(e) {
    var val = e.target.value.trim();
    if (!val) return;
    var match = (globalMechanics || []).find(function (m) {
      return (m.nama && m.nama.toUpperCase() === val.toUpperCase());
    });
    if (match) {
      addInspectorTag(match.nama);
      e.target.value = '';
    }
  }

  function addSelectedInspectorFromInput() {
    var inp = document.getElementById('inspInspektorInput');
    if (!inp) return;
    var val = inp.value.trim();
    if (!val) return;

    var parts = val.split(/[,;&/]+/);
    parts.forEach(function (p) {
      var name = p.trim().toUpperCase();
      if (name) addInspectorTag(name);
    });
    inp.value = '';
    inp.focus();
  }

  function addInspectorTag(name) {
    var clean = name.trim().toUpperCase();
    if (!clean) return;
    if (selectedInspectorsList.indexOf(clean) !== -1) {
      showToast('Inspektor ' + clean + ' sudah ada di daftar!', 'info');
      return;
    }
    selectedInspectorsList.push(clean);
    renderSelectedInspectorTags();
  }

  function removeSelectedInspectorTag(index) {
    if (index >= 0 && index < selectedInspectorsList.length) {
      selectedInspectorsList.splice(index, 1);
      renderSelectedInspectorTags();
    }
  }

  function clearSelectedInspectorTags() {
    selectedInspectorsList = [];
    renderSelectedInspectorTags();
  }

  function renderSelectedInspectorTags() {
    var container = document.getElementById('inspInspektorTagsContainer');
    var hiddenInp = document.getElementById('inspInspektor');
    if (hiddenInp) hiddenInp.value = selectedInspectorsList.join(', ');
    if (!container) return;
    if (selectedInspectorsList.length === 0) {
      container.innerHTML = '';
      return;
    }
    var html = '';
    selectedInspectorsList.forEach(function (name, idx) {
      var safeName = escapeHtml(name);
      html += '<span style="display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg-subtle); border: 1px solid var(--accent-orange); color: var(--text-main); padding: 3px 8px; border-radius: var(--radius-sm); font-size: 11.5px; font-weight: 700;">' +
        '<span>' + safeName + '</span>' +
        '<span onclick="removeSelectedInspectorTag(' + idx + ')" style="cursor: pointer; color: #f87171; font-weight: 900; margin-left: 2px; font-size: 13px;" title="Hapus inspektor">&times;</span>' +
        '</span>';
    });
    container.innerHTML = html;
  }

  // Multi-Inspector Khusus AC
  function handleACInspectorInputKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      addSelectedACInspectorFromInput();
    }
  }

  function handleACInspectorInputDatalist(e) {
    var val = e.target.value.trim();
    if (!val) return;
    var match = (globalMechanics || []).find(function (m) {
      return (m.nama && m.nama.toUpperCase() === val.toUpperCase());
    });
    if (match) {
      addACInspectorTag(match.nama);
      e.target.value = '';
    }
  }

  function addSelectedACInspectorFromInput() {
    var inp = document.getElementById('inspAcInspektorInput');
    if (!inp) return;
    var val = inp.value.trim();
    if (!val) return;

    var parts = val.split(/[,;&/]+/);
    parts.forEach(function (p) {
      var name = p.trim().toUpperCase();
      if (name) addACInspectorTag(name);
    });
    inp.value = '';
    inp.focus();
  }

  function addACInspectorTag(name) {
    var clean = name.trim().toUpperCase();
    if (!clean) return;
    if (selectedACInspectorsList.indexOf(clean) !== -1) {
      showToast('Teknisi AC ' + clean + ' sudah ada di daftar!', 'info');
      return;
    }
    selectedACInspectorsList.push(clean);
    renderSelectedACInspectorTags();
  }

  function removeSelectedACInspectorTag(index) {
    if (index >= 0 && index < selectedACInspectorsList.length) {
      selectedACInspectorsList.splice(index, 1);
      renderSelectedACInspectorTags();
    }
  }

  function clearSelectedACInspectorTags() {
    selectedACInspectorsList = [];
    renderSelectedACInspectorTags();
  }

  function renderSelectedACInspectorTags() {
    var container = document.getElementById('inspAcInspektorTagsContainer');
    var hiddenInp = document.getElementById('inspAcInspektor');
    if (hiddenInp) hiddenInp.value = selectedACInspectorsList.join(', ');
    if (!container) return;
    if (selectedACInspectorsList.length === 0) {
      container.innerHTML = '';
      return;
    }
    var html = '';
    selectedACInspectorsList.forEach(function (name, idx) {
      var safeName = escapeHtml(name);
      html += '<span style="display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg-subtle); border: 1px solid #10b981; color: var(--text-main); padding: 3px 8px; border-radius: var(--radius-sm); font-size: 11.5px; font-weight: 700;">' +
        '<span>' + safeName + '</span>' +
        '<span onclick="removeSelectedACInspectorTag(' + idx + ')" style="cursor: pointer; color: #f87171; font-weight: 900; margin-left: 2px; font-size: 13px;" title="Hapus teknisi AC">&times;</span>' +
        '</span>';
    });
    container.innerHTML = html;
  }

  // ============================================================================
  // 4. ENGINE PREDIKSI JADWAL INSPEKSI ELEKTRIKAL & AC BERDASARKAN HM
  // ============================================================================

  function renderNextInspectionScheduleTable() {
    var tbody = document.getElementById('inspScheduleTableBody');
    if (!tbody) return;

    var latestUnitHM = {};

    // 1. Konsolidasi HM dari Laporan Pekerjaan
    (allFilteredReports || []).forEach(function (r) {
      var unitCode = String(r.noUnit || '').trim().toUpperCase();
      var hmVal = parseFloat(r.hmUnit);
      if (!unitCode || isNaN(hmVal) || hmVal <= 0) return;

      if (!latestUnitHM[unitCode] || hmVal > latestUnitHM[unitCode].hm) {
        latestUnitHM[unitCode] = {
          hm: hmVal,
          tanggal: r.tanggal ? formatDateDDMMYYYY(r.tanggal) : '-',
          model: r.modelUnit || ''
        };
      }
    });

    // 2. Konsolidasi HM dari Log PM
    (window.globalPMLogs || []).forEach(function (pLog) {
      var unitCode = String(pLog.noUnit || '').trim().toUpperCase();
      var hmVal = parseFloat(pLog.hmUnit);
      if (!unitCode || isNaN(hmVal) || hmVal <= 0) return;

      if (!latestUnitHM[unitCode] || hmVal > latestUnitHM[unitCode].hm) {
        latestUnitHM[unitCode] = {
          hm: hmVal,
          tanggal: (pLog.tanggal ? formatDateDDMMYYYY(pLog.tanggal) : '-') + ' (PM)',
          model: latestUnitHM[unitCode] ? latestUnitHM[unitCode].model : ''
        };
      }
    });

    // 3. Konsolidasi HM dari Log Inspeksi
    var allInspLogs = (window.globalInspectionLogs && window.globalInspectionLogs.length > 0)
      ? window.globalInspectionLogs
      : (window.appDataCache && window.appDataCache.inspection && window.appDataCache.inspection.data ? window.appDataCache.inspection.data : []);

    allInspLogs.forEach(function (insp) {
      var unitCode = String(insp.noUnit || '').trim().toUpperCase();
      var hmVal = parseFloat(insp.hmUnit);
      if (!unitCode || isNaN(hmVal) || hmVal <= 0) return;

      if (!latestUnitHM[unitCode] || hmVal > latestUnitHM[unitCode].hm) {
        latestUnitHM[unitCode] = {
          hm: hmVal,
          tanggal: (insp.tanggal ? formatDateDDMMYYYY(insp.tanggal) : '-') + ' (Inspeksi)',
          model: latestUnitHM[unitCode] ? latestUnitHM[unitCode].model : ''
        };
      }
    });

    // 4. Konsolidasi HM dari Master Unit
    (globalUnits || []).forEach(function (u) {
      var unitCode = String(u.noUnit || '').trim().toUpperCase();
      if (!unitCode) return;
      var masterHM = parseFloat(u.hmTerakhir || u.HMTerakhir) || 0;

      if (!latestUnitHM[unitCode]) {
        latestUnitHM[unitCode] = {
          hm: masterHM,
          tanggal: masterHM > 0 ? 'Master Data' : '-',
          model: u.model || '',
          tipe: u.tipe || u.tipeUnit || ''
        };
      } else {
        if (!latestUnitHM[unitCode].model && u.model) latestUnitHM[unitCode].model = u.model;
        if (!latestUnitHM[unitCode].tipe && (u.tipe || u.tipeUnit)) latestUnitHM[unitCode].tipe = u.tipe || u.tipeUnit;
        if (masterHM > latestUnitHM[unitCode].hm) {
          latestUnitHM[unitCode].hm = masterHM;
          latestUnitHM[unitCode].tanggal = 'Master Data';
        }
      }
    });

    var scheduleList = [];

    Object.keys(latestUnitHM).forEach(function (code) {
      var info = latestUnitHM[code];
      var currentHM = info.hm;

      // Temukan log inspeksi terakhir untuk unit ini (Elektrikal & AC)
      var latestInsp = null;
      var latestACInsp = null;
      var latestAnyInsp = null;

      allInspLogs.forEach(function (i) {
        if (String(i.noUnit || '').trim().toUpperCase() === code) {
          var iHM = parseFloat(i.hmUnit) || 0;
          var iDate = i.tanggal || '';
          var isAc = (i.tipeInspeksi === 'AC_SYSTEM' || String(i.catatan || '').indexOf('[INSPEKSI AC]') !== -1);
          var entry = {
            hm: iHM,
            tanggal: iDate,
            isAc: isAc,
            status: i.statusUnit || (isAc ? 'NORMAL' : 'RFU'),
            catatan: i.catatan || '',
            inspektor: i.inspektor || ''
          };

          // Evaluasi inspeksi terbaru secara keseluruhan berdasarkan tanggal, lalu HM
          if (!latestAnyInsp) {
            latestAnyInsp = entry;
          } else {
            var dNew = new Date(iDate);
            var dCurr = new Date(latestAnyInsp.tanggal);
            if (!isNaN(dNew) && !isNaN(dCurr) && dNew > dCurr) {
              latestAnyInsp = entry;
            } else if (iHM > latestAnyInsp.hm && (!dCurr || dNew >= dCurr)) {
              latestAnyInsp = entry;
            }
          }

          if (isAc) {
            if (!latestACInsp || iHM > latestACInsp.hm || (iDate && iDate > (latestACInsp.tanggal || ''))) {
              latestACInsp = entry;
            }
          } else {
            if (!latestInsp || iHM > latestInsp.hm || (iDate && iDate > (latestInsp.tanggal || ''))) {
              latestInsp = entry;
            }
          }
        }
      });

      // 1. Identifikasi Master Data & AC Capability Unit
      var unitObj = (globalUnits || []).find(function (u) {
        return String(u.noUnit || '').trim().toUpperCase() === code;
      }) || { noUnit: code, model: info.model, tipe: info.tipe };

      var unitClassification = (typeof getUnitClassification === 'function')
        ? getUnitClassification(unitObj)
        : (unitObj.tipe || 'HAULER');

      // Evaluasi status AC Unit
      var acBadge = '<span style="font-size:10px; color:#64748b; padding:2px 6px; border-radius:3px; background:rgba(148,163,184,0.1);">NON-AC / STANDAR</span>';
      var hasAC = (unitClassification !== 'SUPPORT' || String(unitObj.model || '').toUpperCase().indexOf('TOWER') === -1);

      if (hasAC) {
        if (latestACInsp) {
          var acSt = String(latestACInsp.status || '').toUpperCase();
          if (acSt.indexOf('RFU') !== -1 || acSt.indexOf('DINGIN') !== -1 || acSt.indexOf('OPTIMAL') !== -1) {
            acBadge = '<span style="font-size:10.5px; font-weight:800; color:#10b981; background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.3); padding:2px 7px; border-radius:3px;">❄️ DINGIN (RFU)</span>';
          } else if (acSt.indexOf('MONITORING') !== -1 || acSt.indexOf('KURANG') !== -1) {
            acBadge = '<span style="font-size:10.5px; font-weight:800; color:#fbbf24; background:rgba(251,191,36,0.15); border:1px solid rgba(251,191,36,0.4); padding:2px 7px; border-radius:3px;">❄️ KURANG DINGIN</span>';
          } else {
            acBadge = '<span style="font-size:10.5px; font-weight:800; color:#ef4444; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); padding:2px 7px; border-radius:3px;">❄️ RUSAK / ANGIN</span>';
          }
        } else {
          acBadge = '<span style="font-size:10px; font-weight:700; color:#38bdf8; background:rgba(56,189,248,0.1); border:1px solid rgba(56,189,248,0.25); padding:2px 6px; border-radius:3px;">❄️ BER-AC (BELUM DICEK)</span>';
        }
      }

      // 2. Target HM Inspeksi Elektrikal (Interval Kelipatan 250 HM)
      var elecTargetInspHM = 0;
      var elecRemainingHM = 0;
      var elecUrgencyCode = 'NORMAL';
      var elecUrgencyLabel = 'NORMAL (&gt; 100 JAM)';
      var elecBadgeStyle = 'background: rgba(52, 211, 153, 0.12); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3);';

      if (currentHM > 0) {
        var baseTargetElec = Math.ceil((currentHM + 0.1) / 250) * 250;
        elecTargetInspHM = baseTargetElec;

        if (latestInsp && latestInsp.hm > 0) {
          var servicedTargetElec = Math.round(latestInsp.hm / 250) * 250;
          if (elecTargetInspHM <= servicedTargetElec || ((currentHM - latestInsp.hm) < 50 && elecTargetInspHM <= servicedTargetElec + 250)) {
            elecTargetInspHM = servicedTargetElec + 250;
          }
        }

        elecRemainingHM = parseFloat((elecTargetInspHM - currentHM).toFixed(1));

        if (elecRemainingHM <= 0) {
          elecUrgencyCode = 'OVERDUE';
          elecUrgencyLabel = 'JATUH TEMPO (HARI INI)';
          elecBadgeStyle = 'background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.5);';
        } else if (elecRemainingHM <= 20) {
          elecUrgencyCode = 'HARI_INI';
          elecUrgencyLabel = 'INSPEKSI HARI INI (&le; 20 JAM)';
          elecBadgeStyle = 'background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);';
        } else if (elecRemainingHM <= 40) {
          elecUrgencyCode = 'BESOK';
          elecUrgencyLabel = 'PREDIKSI BESOK (&le; 40 JAM)';
          elecBadgeStyle = 'background: rgba(251, 191, 36, 0.18); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.5);';
        } else if (elecRemainingHM <= 100) {
          elecUrgencyCode = 'MONITORING';
          elecUrgencyLabel = 'MONITORING (&le; 100 JAM)';
          elecBadgeStyle = 'background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4);';
        } else {
          elecUrgencyCode = 'NORMAL';
          elecUrgencyLabel = 'NORMAL (&gt; 100 JAM)';
          elecBadgeStyle = 'background: rgba(52, 211, 153, 0.12); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3);';
        }
      } else {
        elecUrgencyCode = 'BELUM_ADA_HM';
        elecUrgencyLabel = 'BELUM ADA LOG HM';
        elecBadgeStyle = 'background: rgba(148, 163, 184, 0.08); color: #64748b; border: 1px solid rgba(148, 163, 184, 0.2);';
      }

      // 3. Target HM Inspeksi AC SYSTEM (Interval Kelipatan 150 HM)
      var acTargetInspHM = 0;
      var acRemainingHM = 0;
      var acUrgencyCode = 'NORMAL';
      var acUrgencyLabel = 'NORMAL (&gt; 100 JAM)';
      var acBadgeStyle = 'background: rgba(52, 211, 153, 0.12); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3);';

      if (hasAC && currentHM > 0) {
        var baseTargetAC = Math.ceil((currentHM + 0.1) / 150) * 150;
        acTargetInspHM = baseTargetAC;

        if (latestACInsp && latestACInsp.hm > 0) {
          var servicedTargetAC = Math.round(latestACInsp.hm / 150) * 150;
          if (acTargetInspHM <= servicedTargetAC || ((currentHM - latestACInsp.hm) < 30 && acTargetInspHM <= servicedTargetAC + 150)) {
            acTargetInspHM = servicedTargetAC + 150;
          }
        }

        acRemainingHM = parseFloat((acTargetInspHM - currentHM).toFixed(1));

        if (acRemainingHM <= 0) {
          acUrgencyCode = 'OVERDUE';
          acUrgencyLabel = 'JATUH TEMPO (HARI INI)';
          acBadgeStyle = 'background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.5);';
        } else if (acRemainingHM <= 20) {
          acUrgencyCode = 'HARI_INI';
          acUrgencyLabel = 'INSPEKSI HARI INI (&le; 20 JAM)';
          acBadgeStyle = 'background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);';
        } else if (acRemainingHM <= 40) {
          acUrgencyCode = 'BESOK';
          acUrgencyLabel = 'PREDIKSI BESOK (&le; 40 JAM)';
          acBadgeStyle = 'background: rgba(251, 191, 36, 0.18); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.5);';
        } else if (acRemainingHM <= 100) {
          acUrgencyCode = 'MONITORING';
          acUrgencyLabel = 'MONITORING (&le; 100 JAM)';
          acBadgeStyle = 'background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4);';
        } else {
          acUrgencyCode = 'NORMAL';
          acUrgencyLabel = 'NORMAL (&gt; 100 JAM)';
          acBadgeStyle = 'background: rgba(52, 211, 153, 0.12); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3);';
        }
      } else if (!hasAC) {
        acUrgencyCode = 'NON_AC';
        acUrgencyLabel = 'NON-AC / STANDAR';
        acBadgeStyle = 'background: rgba(148, 163, 184, 0.08); color: #64748b; border: 1px solid rgba(148, 163, 184, 0.2);';
      } else {
        acUrgencyCode = 'BELUM_ADA_HM';
        acUrgencyLabel = 'BELUM ADA LOG HM';
        acBadgeStyle = 'background: rgba(148, 163, 184, 0.08); color: #64748b; border: 1px solid rgba(148, 163, 184, 0.2);';
      }

      scheduleList.push({
        noUnit: code,
        model: info.model || unitObj.model || '-',
        tipe: unitClassification,
        currentHM: currentHM,
        lastDate: info.tanggal,
        latestInsp: latestInsp,
        latestACInsp: latestACInsp,
        latestAnyInsp: latestAnyInsp,

        // Metrik Elektrikal (Interval 250 HM)
        elecTargetInspHM: elecTargetInspHM,
        elecRemainingHM: elecRemainingHM,
        elecUrgencyCode: elecUrgencyCode,
        elecUrgencyLabel: elecUrgencyLabel,
        elecBadgeStyle: elecBadgeStyle,

        // Metrik AC SYSTEM (Interval 150 HM)
        acTargetInspHM: acTargetInspHM,
        acRemainingHM: acRemainingHM,
        acUrgencyCode: acUrgencyCode,
        acUrgencyLabel: acUrgencyLabel,
        acBadgeStyle: acBadgeStyle,

        // Properti Kompatibilitas Bawaan
        targetInspHM: elecTargetInspHM,
        remainingHM: elecRemainingHM,
        urgencyCode: elecUrgencyCode,
        urgencyLabel: elecUrgencyLabel,
        badgeStyle: elecBadgeStyle,

        hasAC: hasAC,
        acBadge: acBadge
      });
    });

  function renderInspectionScheduleRows(dataList) {
    var tbody = document.getElementById('inspScheduleTableBody');
    if (!tbody) return;

    var isAcMode = (currentInspectionSystemFilter === 'AC');

    var filtered = (dataList || globalInspectionScheduleData).filter(function (item) {
      // Filter Tipe Unit
      if (currentInspectionUnitTypeFilter !== 'ALL' && item.tipe !== currentInspectionUnitTypeFilter) {
        return false;
      }
      // Filter Sistem
      if (isAcMode && !item.hasAC) {
        return false;
      }
      // Filter Status Kartu
      var remHM = isAcMode ? item.acRemainingHM : item.elecRemainingHM;
      var urgCode = isAcMode ? item.acUrgencyCode : item.elecUrgencyCode;

      if (currentInspectionCardFilter === 'HARI_INI' && (remHM > 20 && urgCode !== 'OVERDUE')) {
        return false;
      }
      if (currentInspectionCardFilter === 'BESOK' && (remHM <= 20 || remHM > 40)) {
        return false;
      }
      if (currentInspectionCardFilter === 'OVERDUE' && (urgCode !== 'OVERDUE' && remHM > 0)) {
        return false;
      }
      // Filter Pencarian
      if (currentInspectionSearchQuery) {
        var q = currentInspectionSearchQuery.toUpperCase();
        var matchU = String(item.noUnit || '').toUpperCase().indexOf(q) !== -1;
        var matchM = String(item.model || '').toUpperCase().indexOf(q) !== -1;
        var matchT = String(item.tipe || '').toUpperCase().indexOf(q) !== -1;
        if (!matchU && !matchM && !matchT) return false;
      }
      return true;
    });

    // Urutkan: Overdue / sisa HM terkecil berada paling atas berdasarkan sistem aktif
    filtered.sort(function (a, b) {
      var remA = isAcMode ? a.acRemainingHM : a.elecRemainingHM;
      var remB = isAcMode ? b.acRemainingHM : b.elecRemainingHM;
      if (a.currentHM > 0 && b.currentHM > 0) return remA - remB;
      if (a.currentHM > 0 && b.currentHM <= 0) return -1;
      if (a.currentHM <= 0 && b.currentHM > 0) return 1;
      return a.noUnit.localeCompare(b.noUnit);
    });

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 25px; color: var(--text-muted); font-size: 12px;">Tidak ada data unit yang sesuai dengan filter yang dipilih.</td></tr>';
      return;
    }

    var html = '';
    filtered.forEach(function (row, idx) {
      var safeU = escapeHtml(row.noUnit);
      var safeM = escapeHtml(row.model);

      var inspRecord = isAcMode
        ? row.latestACInsp
        : (row.latestAnyInsp || row.latestInsp || row.latestACInsp);

      var lastInspText = '-';
      if (inspRecord && inspRecord.tanggal) {
        var fmtDate = formatDateDDMMYYYY(inspRecord.tanggal);
        var hmStr = inspRecord.hm > 0 ? (inspRecord.hm.toLocaleString('id-ID') + ' HM') : '';
        var sysTag = inspRecord.isAc
          ? '<span style="color: #38bdf8; font-size: 10px; font-weight: 700;">❄️ AC</span>'
          : '<span style="color: #fbbf24; font-size: 10px; font-weight: 700;">⚡ Elec</span>';
        lastInspText = '<div style="font-weight: 800; color: #0f172a; font-size: 12px; line-height: 1.2;">' + fmtDate + '</div>' +
          (hmStr ? '<div style="font-size: 10.5px; color: var(--text-dim); margin-top: 2px;">' + hmStr + ' · ' + sysTag + '</div>' : '<div style="margin-top: 2px;">' + sysTag + '</div>');
      }

      var rowTargetHM = isAcMode ? row.acTargetInspHM : row.elecTargetInspHM;
      var rowRemainingHM = isAcMode ? row.acRemainingHM : row.elecRemainingHM;
      var rowUrgencyLabel = isAcMode ? row.acUrgencyLabel : row.elecUrgencyLabel;
      var rowBadgeStyle = isAcMode ? row.acBadgeStyle : row.elecBadgeStyle;
      var formMode = isAcMode ? 'ac' : 'elec';

      var sisaBadge = '-';
      if (row.currentHM > 0) {
        if (rowRemainingHM <= 0) {
          sisaBadge = '<span style="color: #0f172a; font-weight: 800;">Lewat ' + Math.abs(rowRemainingHM).toFixed(1) + ' Jam</span>';
        } else {
          sisaBadge = '<span style="color: #0f172a; font-weight: 800;">' + rowRemainingHM.toFixed(1) + ' Jam</span>';
        }
      }

      html += '<tr>' +
        '<td style="text-align: center; color: var(--text-muted); font-weight: 600;">' + (idx + 1) + '</td>' +
        '<td><strong style="color: #0f172a; font-size: 13px;">' + safeU + '</strong></td>' +
        '<td><strong style="color: var(--text-main); font-size: 12px;">' + safeM + '</strong></td>' +
        '<td style="text-align: right; font-weight: 700; color: var(--text-main);">' + (row.currentHM > 0 ? row.currentHM.toFixed(1) : '-') + '</td>' +
        '<td style="text-align: center; color: var(--text-muted); font-size: 11px;">' + escapeHtml(row.lastDate || '-') + '</td>' +
        '<td style="text-align: right; font-weight: 700; color: var(--accent-orange);">' + (rowTargetHM > 0 ? rowTargetHM.toFixed(1) : '-') + '</td>' +
        '<td style="text-align: right;">' + sisaBadge + '</td>' +
        '<td style="text-align: center;"><span style="font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 4px; display: inline-block; ' + rowBadgeStyle + '">' + rowUrgencyLabel + '</span></td>' +
        '<td style="text-align: center;">' +
        '<button type="button" class="btn-submit" style="padding: 4px 10px; font-size: 11px; white-space: nowrap;" onclick="applyUnitToInspectionForm(\'' + safeU + '\', ' + row.currentHM + ', \'' + formMode + '\')">+ Input</button>' +
        '</td>' +
        '</tr>';
    });

    tbody.innerHTML = html;
  }

  function filterInspectionUnitType(type) {
    currentInspectionUnitTypeFilter = (type || 'ALL').toUpperCase();

    var pills = ['ALL', 'HAULER', 'DIGGER', 'ANCILLARY', 'SUPPORT'];
    pills.forEach(function (p) {
      var btn = document.getElementById('btnFilterInsp-' + p);
      if (btn) btn.classList.toggle('active', p === currentInspectionUnitTypeFilter);
    });

    updateInspectionMetricsAndSpotlights();
    renderInspectionScheduleRows();
  }
  window.filterInspectionUnitType = filterInspectionUnitType;

  function filterInspectionSystemType(sys) {
    currentInspectionSystemFilter = (sys || 'ALL').toUpperCase();

    var pills = ['ALL', 'ELEC', 'AC'];
    pills.forEach(function (p) {
      var btn = document.getElementById('btnFilterInspSys-' + p);
      if (btn) btn.classList.toggle('active', p === currentInspectionSystemFilter);
    });

    updateInspectionMetricsAndSpotlights();
    renderInspectionScheduleRows();

  window.filterInspectionSystemType = filterInspectionSystemType;

  function closeInspectionSpotlightPanel() {
    var spotSection = document.getElementById('inspSpotlightSection');
    var boxToday = document.getElementById('inspTodaySpotlightBox');
    var boxTomorrow = document.getElementById('inspTomorrowSpotlightBox');
    var boxOverdue = document.getElementById('inspOverdueSpotlightBox');
    if (spotSection) spotSection.style.display = 'none';
    if (boxToday) boxToday.style.display = 'none';
    if (boxTomorrow) boxTomorrow.style.display = 'none';
    if (boxOverdue) boxOverdue.style.display = 'none';

    var cards = ['inspCardToday', 'inspCardTomorrow', 'inspCardOverdue'];
    cards.forEach(function (cid) {

  window.closeInspectionSpotlightPanel = closeInspectionSpotlightPanel;

  function filterInspectionCardStatus(status) {
    var spotSection = document.getElementById('inspSpotlightSection');
    var boxToday = document.getElementById('inspTodaySpotlightBox');
    var boxTomorrow = document.getElementById('inspTomorrowSpotlightBox');
    var boxOverdue = document.getElementById('inspOverdueSpotlightBox');

    // Cek apakah sedang toggle off (kartu yang sama diklik ulang saat spotlight aktif)
    var isTogglingOff = false;
    if (status === 'HARI_INI' && spotSection && spotSection.style.display !== 'none' && boxToday && boxToday.style.display !== 'none') {
      isTogglingOff = true;
    } else if (status === 'BESOK' && spotSection && spotSection.style.display !== 'none' && boxTomorrow && boxTomorrow.style.display !== 'none') {
      isTogglingOff = true;
    } else if (status === 'OVERDUE' && spotSection && spotSection.style.display !== 'none' && boxOverdue && boxOverdue.style.display !== 'none') {
      isTogglingOff = true;
    }

    if (isTogglingOff) {
      closeInspectionSpotlightPanel();
      return;
    }

    currentInspectionCardFilter = status;

    var cards = ['inspCardToday', 'inspCardTomorrow', 'inspCardOverdue'];
    cards.forEach(function (cid) {
      var el = document.getElementById(cid);
      if (el) el.style.borderColor = 'var(--border-card)';
    });

    if (spotSection) {
      if (status === 'HARI_INI') {
        spotSection.style.display = 'grid';
        if (boxToday) boxToday.style.display = 'block';
        if (boxTomorrow) boxTomorrow.style.display = 'none';
        if (boxOverdue) boxOverdue.style.display = 'none';
        var c1 = document.getElementById('inspCardToday');
        if (c1) c1.style.borderColor = '#f87171';
        spotSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else if (status === 'BESOK') {
        spotSection.style.display = 'grid';
        if (boxTomorrow) boxTomorrow.style.display = 'block';
        if (boxToday) boxToday.style.display = 'none';
        if (boxOverdue) boxOverdue.style.display = 'none';
        var c2 = document.getElementById('inspCardTomorrow');
        if (c2) c2.style.borderColor = '#fbbf24';
        spotSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else if (status === 'OVERDUE') {
        spotSection.style.display = 'grid';
        if (boxOverdue) boxOverdue.style.display = 'block';
        if (boxToday) boxToday.style.display = 'none';
        if (boxTomorrow) boxTomorrow.style.display = 'none';
        var c3 = document.getElementById('inspCardOverdue');
        if (c3) c3.style.borderColor = '#ef4444';
        spotSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    renderInspectionScheduleRows();
  }

      }
    } else {
      var rawElecTxt = String(log.catatan || '');
      var mCabin = rawElecTxt.match(/Cabin:\s*([^|\]]+)/i);
      var mSafety = rawElecTxt.match(/Safety:\s*([^|\]]+)/i);
      var mBattery = rawElecTxt.match(/Battery:\s*([^|\]]+)/i);

      var valCabin = log.cabinInstrument || (mCabin ? mCabin[1].trim() : 'NORMAL SEMUA');
      var valSafety = log.safetyDevice || (mSafety ? mSafety[1].trim() : 'NORMAL & AKTIF');
      var valBaterai = log.baterai || (mBattery ? mBattery[1].trim() : 'BERSIH');

      if (elChecklist) {
        elChecklist.innerHTML = '<div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:8px;">Hasil Checklist Elektrikal:</div>' +
          '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:11.5px; line-height:1.45;">' +
          '<div>Starter: <strong>' + escapeHtml(log.startingMotor || 'NORMAL') + '</strong></div>' +
          '<div>Alternator: <strong>' + escapeHtml(log.alternator || 'NORMAL') + '</strong></div>' +
          '<div>Lighting: <strong>' + escapeHtml(log.lightingSystem || 'NORMAL') + '</strong></div>' +
          '<div>Wiring: <strong>' + escapeHtml(log.wiringHarness || 'RAPI') + '</strong></div>' +
          '<div>Cabin / Gauges: <strong>' + escapeHtml(valCabin) + '</strong></div>' +
          '<div>Safety Device: <strong>' + escapeHtml(valSafety) + '</strong></div>' +
          '<div style="grid-column: 1 / -1;">Battery & Cable: <strong>' + escapeHtml(valBaterai) + '</strong></div>' +
          '</div>';
      }
      if (elCatatan) {
        var rawElecCatatan = log.catatan || '';
        var cleanElecCatatan = rawElecCatatan
          .replace(/^\[STATUS\s*UNIT:[^\]]*\]\s*/i, '')
          .replace(/\[Cabin:[^\]]*\]\s*/i, '')
          .replace(/^\[INSPEKSI\s*AC\]\s*/i, '')
          .trim();
        var isElecCatatanValid = (cleanElecCatatan && cleanElecCatatan !== '-' && cleanElecCatatan.toUpperCase() !== 'NIHIL' && cleanElecCatatan.toUpperCase() !== 'N/A');
        elCatatan.textContent = isElecCatatanValid ? cleanElecCatatan : 'Tidak ada catatan tambahan.';
      }
    }

    if (photoContainer) {
      var photos = log.photosList || [];
      var captions = log.photoCaptions || [];

      if (photos.length === 0 && log.imagesBase64 && log.imagesBase64.length > 0) {
        photos = log.imagesBase64;
      }

      if (photos.length === 0) {
        photoContainer.innerHTML = '<div style="font-size: 11.5px; color: var(--text-dim); padding: 8px;">Tidak ada lampiran foto temuan inspeksi.</div>';
      } else {
        var hPhotos = '<div style="display: flex; gap: 8px; flex-wrap: wrap;">';
        photos.forEach(function (pUrl, pIdx) {
          var cleanUrl = getDirectDriveImageUrl(pUrl);
          var capText = captions[pIdx] || 'Foto Temuan #' + (pIdx + 1);
          hPhotos += '<div style="display: flex; flex-direction: column; width: 110px;">' +
            '<img src="' + cleanUrl + '" style="width: 110px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border-color); cursor: pointer;" onclick="openImageModal(\'' + cleanUrl + '\', \'' + escapeHtml(capText) + '\')">' +
            '<span style="font-size: 9.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.2; word-break: break-word;">' + escapeHtml(capText) + '</span>' +
            '</div>';
        });
        hPhotos += '</div>';
        photoContainer.innerHTML = hPhotos;
      }
    }

    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  window.openDetailInspectionModal = openDetailInspectionModal;

  function closeDetailInspectionModal() {
    var modal = document.getElementById('viewInspectionDetailModal');
    if (modal) {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }
  }
  window.closeDetailInspectionModal = closeDetailInspectionModal;
</script>
