<script>
  /**
   * ============================================================================
   * SISTEM REPORT PEKERJAAN AUTO ELECTRICIAN - PT. SAMUDERA MULIA ABADI (KONAWE)
   * File: js-productivity.html (Tab Produktivitas Mekanik, PIN Admin, & Evaluasi)
   * ============================================================================
   */

  function handleProductivityTabClick() {
    if (isAdminAuthorized) {
      switchTab('productivity');
    } else {
      openAdminPinModal();
    }
  }

  function openAdminPinModal() {
    var modal = document.getElementById('adminPinModal');
    var inp = document.getElementById('adminPinInput');
    var err = document.getElementById('adminPinError');
    if (err) err.style.display = 'none';
    if (inp) inp.value = '';
    if (modal) modal.classList.add('active');
    if (inp) setTimeout(function () { inp.focus(); }, 150);
  }

  function closeAdminPinModal() {
    var modal = document.getElementById('adminPinModal');
    if (modal) modal.classList.remove('active');
  }

  function handleAdminPinSubmit(e) {
    e.preventDefault();
    var inp = document.getElementById('adminPinInput');
    var err = document.getElementById('adminPinError');
    var enteredPin = inp ? inp.value.trim() : '';
    var registeredPin = '2026';

    if (enteredPin === registeredPin) {
      isAdminAuthorized = true;
      closeAdminPinModal();
      showToast('Akses Admin berhasil dibuka.', 'success');
      switchTab('productivity');
    } else {
      if (err) err.style.display = 'block';
      if (inp) {
        inp.value = '';
        inp.focus();
      }
      showToast('PIN Admin salah!', 'error');
    }
  }

  function lockProductivityTab() {
    isAdminAuthorized = false;
    showToast('Tab Produktivitas Mekanik telah dikunci kembali.', 'info');
    switchTab('dashboard');
  }

  function loadMechanicProductivityData() {
    var tbody = document.getElementById('mechanicProductivityTableBody');
    if (!tbody) return;

    var mechMap = {};
    (globalMechanics || []).forEach(function (m) {
      var name = String(m.nama || '').trim().toUpperCase();
      if (name) {
        mechMap[name] = {
          nama: name,
          keahlian: m.keahlian || 'AUTO ELECTRICIAN',
          nrp: m.nrp || '-',
          totalLaporan: 0,
          totalPerbaikan: 0,
          totalDt: 0,
          unitCatMap: {},
          unitsHandled: {},
          reports: []
        };
      }
    });

    (allFilteredReports || []).forEach(function (r) {
      var rawNames = String(r.namaMekanik || '').trim().toUpperCase();
      if (!rawNames) return;

      var names = rawNames.split(/[,;&/]+/);
      names.forEach(function (n) {
        var name = n.trim();
        if (!name) return;

        if (!mechMap[name]) {
          mechMap[name] = {
            nama: name,
            keahlian: 'AUTO ELECTRICIAN',
            nrp: '-',
            totalLaporan: 0,
            totalPerbaikan: 0,
            totalDt: 0,
            unitCatMap: {},
            unitsHandled: {},
            reports: []
          };
        }

        var dt = parseFloat(r.downtimeJam) || 0;
        mechMap[name].totalLaporan++;
        mechMap[name].totalDt += dt;
        mechMap[name].reports.push(r);

        var st = String(r.status || 'RFU').toUpperCase();
        if (st === 'RFU') mechMap[name].totalPerbaikan++;

        var unit = String(r.noUnit || '').trim().toUpperCase();
        var cat = (typeof normalizeCategoryName === 'function')
          ? normalizeCategoryName(r.kategoriPekerjaan)
          : String(r.kategoriPekerjaan || 'LAIN-LAIN').trim().toUpperCase();
        if (unit && unit !== '-') {
          mechMap[name].unitsHandled[unit] = true;
          var key = unit + '|||' + cat;
          mechMap[name].unitCatMap[key] = (mechMap[name].unitCatMap[key] || 0) + 1;
        }
      });
    });

    var list = Object.keys(mechMap).map(function (key) {
      var item = mechMap[key];
      var totalLaporan = item.totalLaporan;
      var totalPerbaikan = item.totalPerbaikan;
      var totalDt = item.totalDt;

      var mttrNum = totalLaporan > 0 ? parseFloat((totalDt / totalLaporan).toFixed(1)) : 0.0;
      var mttrStr = mttrNum.toFixed(1);

      var unitsHandledCount = Object.keys(item.unitsHandled).length;
      var totalOperatingHours = (unitsHandledCount > 0 ? unitsHandledCount : 1) * 30 * 24;
      var mtbfVal = totalLaporan > 0 ? Math.max(0, Math.round((totalOperatingHours - totalDt) / totalLaporan)) : 0;

      var rusakBerulangCount = 0;
      for (var k in item.unitCatMap) {
        if (item.unitCatMap[k] > 1) {
          rusakBerulangCount += (item.unitCatMap[k] - 1);
        }
      }

      var rfuRate = totalLaporan > 0 ? (totalPerbaikan / totalLaporan) * 100 : 0;
      var grade = 'STANDAR';
      var gradeBadgeStyle = 'background: rgba(148, 163, 184, 0.12); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3);';

      if (totalLaporan === 0) {
        grade = 'STANDBY / NIHIL';
        gradeBadgeStyle = 'background: rgba(100, 116, 139, 0.12); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.25);';
      } else if (totalLaporan >= 5 && rfuRate >= 85 && mttrNum <= 2.2 && rusakBerulangCount === 0) {
        grade = 'SANGAT PRODUKTIF';
        gradeBadgeStyle = 'background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4);';
      } else if (totalLaporan >= 3 && rfuRate >= 75 && mttrNum <= 3.5 && rusakBerulangCount <= 1) {
        grade = 'PRODUKTIF';
        gradeBadgeStyle = 'background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4);';
      } else if (rusakBerulangCount >= 2 || (totalLaporan >= 3 && rfuRate < 60)) {
        grade = 'PERLU EVALUASI TEKNIS';
        gradeBadgeStyle = 'background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);';
      } else {
        grade = 'CUKUP / STANDAR';
        gradeBadgeStyle = 'background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.4);';
      }

      return {
        nama: item.nama,
        keahlian: item.keahlian,
        nrp: item.nrp,
        totalLaporan: totalLaporan,
        totalPerbaikan: totalPerbaikan,
        mttr: mttrStr,
        mtbf: mtbfVal,
        rusakBerulang: rusakBerulangCount,
        grade: grade,
        gradeBadgeStyle: gradeBadgeStyle,
        reports: item.reports
      };
    });

    list.sort(function (a, b) {
      if (b.totalPerbaikan !== a.totalPerbaikan) return b.totalPerbaikan - a.totalPerbaikan;
      if (a.rusakBerulang !== b.rusakBerulang) return a.rusakBerulang - b.rusakBerulang;
      return parseFloat(a.mttr) - parseFloat(b.mttr);
    });

    globalProductivityData = list;

    var totalLaporanAll = list.reduce(function (acc, m) { return acc + m.totalLaporan; }, 0);
    var totalPerbaikanAll = list.reduce(function (acc, m) { return acc + m.totalPerbaikan; }, 0);
    var totalDtAll = list.reduce(function (acc, m) { return acc + (parseFloat(m.mttr) * m.totalLaporan); }, 0);
    var avgMttrAll = totalLaporanAll > 0 ? (totalDtAll / totalLaporanAll).toFixed(1) : '0.0';
    var activeMechanics = list.filter(function (m) { return m.totalLaporan > 0; });
    var avgMtbfAll = activeMechanics.length > 0 ? Math.round(activeMechanics.reduce(function (acc, m) { return acc + m.mtbf; }, 0) / activeMechanics.length) : 0;
    var totalRecurringAll = list.reduce(function (acc, m) { return acc + m.rusakBerulang; }, 0);

    setMetricText('prodMetricLaporan', totalLaporanAll + ' Log');
    setMetricText('prodMetricPerbaikan', totalPerbaikanAll + ' Job');
    setMetricText('prodMetricMTTR', avgMttrAll + ' Jam');
    setMetricText('prodMetricMTBF', avgMtbfAll + ' Jam');
    setMetricText('prodMetricRecurring', totalRecurringAll + ' Kasus');
    setMetricText('prodBadgeMechanicCount', list.length);

    renderMechanicProductivityTable(list);
  }

  function renderMechanicProductivityTable(list) {
    var tbody = document.getElementById('mechanicProductivityTableBody');
    if (!tbody) return;

    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:24px; color:var(--text-muted);">Tidak ada data teknisi yang ditemukan.</td></tr>';
      return;
    }

    var html = '';
    list.forEach(function (item, idx) {
      var safeName = escapeHtml(item.nama);
      var recurringBadge = item.rusakBerulang === 0
        ? '<span style="color: #34d399; font-weight: 700;">0 Kasus</span>'
        : '<span style="color: #f87171; font-weight: 800;">' + item.rusakBerulang + ' Kasus</span>';

      html += '<tr style="border-bottom:1px solid var(--border-subtle);">' +
        '<td style="text-align:center; color:var(--text-dim);">' + (idx + 1) + '</td>' +
        '<td><strong style="color:var(--text-main); font-size:12.5px;">' + safeName + '</strong>' + (item.nrp && item.nrp !== '-' ? '<div style="font-size:10px; color:var(--text-dim);">' + escapeHtml(item.nrp) + '</div>' : '') + '</td>' +
        '<td style="color:var(--text-muted); font-size:11px;">' + escapeHtml(item.keahlian) + '</td>' +
        '<td style="text-align:center; font-weight:700; color:var(--text-main);">' + item.totalLaporan + ' Lap</td>' +
        '<td style="text-align:center; font-weight:700; color:var(--accent-green);">' + item.totalPerbaikan + ' Job</td>' +
        '<td style="text-align:center; font-weight:700; color:var(--text-main);">' + item.mttr + ' Jam</td>' +
        '<td style="text-align:center; font-weight:700; color:var(--text-main);">' + item.mtbf + ' Jam</td>' +
        '<td style="text-align:center;">' + recurringBadge + '</td>' +
        '<td style="text-align:center;"><span style="display:inline-block; padding:3px 9px; border-radius:4px; font-size:10px; font-weight:800; letter-spacing:0.3px; ' + item.gradeBadgeStyle + '">' + escapeHtml(item.grade) + '</span></td>' +
        '<td style="text-align:center;">' +
        '<button type="button" class="btn-secondary" style="padding:3px 8px; font-size:10.5px;" onclick="openMechanicJobsModal(\'' + safeName + '\')">Buka Log</button>' +
        '</td>' +
        '</tr>';
    });

    tbody.innerHTML = html;
  }

  function filterMechanicProductivityTable() {
    var keyword = document.getElementById('prodSearchInput') ? document.getElementById('prodSearchInput').value.toLowerCase().trim() : '';
    if (!globalProductivityData) return;

    var filtered = globalProductivityData.filter(function (item) {
      if (!keyword) return true;
      return (item.nama && item.nama.toLowerCase().indexOf(keyword) !== -1) ||
        (item.keahlian && item.keahlian.toLowerCase().indexOf(keyword) !== -1) ||
        (item.grade && item.grade.toLowerCase().indexOf(keyword) !== -1);
    });

    renderMechanicProductivityTable(filtered);
  }

  function openMechanicJobsModal(mechanicName) {
    var mechObj = (globalProductivityData || []).find(function (m) { return m.nama === mechanicName; });
    var reports = mechObj ? mechObj.reports : [];
    openMatrixDetailModal('RIWAYAT KERJA: ' + mechanicName, 'Daftar intervensi perbaikan yang ditangani oleh ' + mechanicName, reports);
  }

  function openMatrixDetailModal(title, subtitle, reports) {
    if (typeof sortListByDateDescending === 'function') {
      reports = sortListByDateDescending(reports, 'tanggal');
    }
    document.getElementById('matrixModalTitle').textContent = title;
    document.getElementById('matrixModalSubtitle').textContent = subtitle;
    var badge = document.getElementById('matrixModalBadge');
    if (badge) badge.textContent = (reports ? reports.length : 0) + ' Kasus';

    var totalDt = 0;
    (reports || []).forEach(function (r) { totalDt += (parseFloat(r.downtimeJam) || 0); });
    document.getElementById('matrixModalTotalKasus').textContent = (reports ? reports.length : 0) + ' Kasus';
    document.getElementById('matrixModalTotalDowntime').textContent = totalDt.toFixed(1) + ' Jam';

    var container = document.getElementById('matrixModalCardsContainer');
    if (!container) return;

    if (!reports || reports.length === 0) {
      container.innerHTML = '<div style="text-align: center; padding: 24px; color: var(--text-muted);">Tidak ada data riwayat perbaikan yang ditemukan.</div>';
    } else {
      var html = '';
      reports.forEach(function (rep, idx) {
        var safeUnit = escapeHtml(rep.noUnit || '-');
        var normCat = (typeof normalizeCategoryName === 'function')
          ? normalizeCategoryName(rep.kategoriPekerjaan)
          : (rep.kategoriPekerjaan || '-');
        var safeCat = escapeHtml(normCat);
        var safeDesc = escapeHtml(rep.deskripsiPekerjaan || '-');
        var safeDt = escapeHtml(rep.downtimeJam || '0');
        var safeMek = escapeHtml(rep.namaMekanik || '-');
        var safeTgl = escapeHtml(rep.tanggal ? formatDateDDMMYYYY(rep.tanggal) : '-');
        var safeStatus = escapeHtml(rep.status || 'RFU');

        html += '<div style="background: var(--input-bg); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12px; display: flex; flex-direction: column; gap: 4px;">' +
          '<div style="display: flex; justify-content: space-between; align-items: center;">' +
          '<div>' +
          '<span style="font-weight: 800; color: var(--text-dim); margin-right: 6px;">#' + (idx + 1) + '</span>' +
          '<strong style="font-size: 13.5px; color: #ffffff;">' + safeUnit + '</strong>' +
          '<span style="margin-left: 8px; color: var(--accent-orange); font-weight: 700;">' + safeCat + '</span>' +
          '</div>' +
          '<div style="font-weight: 700; color: var(--text-muted);">' + safeStatus + ' · DT: ' + safeDt + ' Jam</div>' +
          '</div>' +
          '<div style="color: var(--text-main); line-height: 1.4; margin-top: 2px;">' + safeDesc + '</div>' +
          '<div style="display: flex; gap: 14px; color: var(--text-dim); font-size: 11px; margin-top: 4px;">' +
          '<div>📅 ' + safeTgl + '</div>' +
          '<div>👨‍🔧 ' + safeMek + '</div>' +
          '</div>' +
          '</div>';
      });
      container.innerHTML = html;
    }

    var modal = document.getElementById('matrixDetailModal');
    if (modal) modal.classList.add('active');
  }

  function closeMatrixDetailModal() {
    var modal = document.getElementById('matrixDetailModal');
    if (modal) modal.classList.remove('active');
  }
</script>
