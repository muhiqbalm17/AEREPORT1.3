<style>
  /**
   * ============================================================================
   * SISTEM REPORT PEKERJAAN AUTO ELECTRICIAN - PT. SAMUDERA MULIA ABADI (KONAWE)
   * File: css.html (Styling Engine: Clean Industrial Theme & Rigid Mobile Lock)
   * ============================================================================
   */

  /* TEMA UTAMA: CLEAN INDUSTRIAL LIGHT DENGAN BORDER TEGAS & JELAS */
  :root,
  html[data-theme="default"],
  body[data-theme="default"],
  [data-theme="default"] {
    --bg-body: #f4f6f9;
    --card-bg: #ffffff;
    --card-bg-subtle: #f8fafc;

    /* PENEGASAN GARIS TEPI (HIGH-CONTRAST BORDERS) */
    --border-color: #cbd5e1;
    --border-card: #b6c2d1;
    --border-subtle: #e2e8f0;
    --input-bg: #ffffff;
    --input-border: #94a3b8;

    --accent-orange: #d97706;
    --accent-orange-hover: #b45309;
    --accent-orange-light: rgba(217, 119, 6, 0.12);

    --accent-blue: #0284c7;
    --accent-green: #059669;
    --accent-red: #dc2626;

    --text-main: #0f172a;
    --text-muted: #475569;
    --text-dim: #64748b;

    --topbar-height: 64px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --card-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* PENGUNCIAN ROOT VIEWPORT: ANTI-GESER HORIZONTAL PATEN (100% PRESISI RATA KIRI-KANAN) */
  html {
    width: 100% !important;
    max-width: 100vw !important;
    overflow-x: hidden !important;
    overflow-x: clip !important;
    position: relative !important;
    box-sizing: border-box !important;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
    overscroll-behavior-x: none !important;
    overscroll-behavior-y: auto;
  }

  body {
    width: 100% !important;
    max-width: 100vw !important;
    min-height: 100vh;
    overflow-x: hidden !important;
    overflow-x: clip !important;
    position: relative !important;
    background-color: var(--bg-body) !important;
    color: var(--text-main);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    touch-action: manipulation;
    overscroll-behavior-x: none !important;
    overscroll-behavior-y: auto;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  body:has(.modal-backdrop.active) {
    overflow: hidden !important;
  }

  /* HEADER (TOPBAR): DIKUNCI KE WARNA GELAP EKSISTING */
  .topbar {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 200;
    width: 100%;
    max-width: 100%;
    height: var(--topbar-height);
    background-color: #0d1525 !important;
    border-bottom: 2px solid #233552 !important;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    box-sizing: border-box;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1 1 auto;
  }

  /* WADAH LOGO RESMI PT SAMUDERA MULIA ABADI (SMA) - INTERAKTIF HIDDEN GATEWAY */
  .topbar-logo-container {
    width: auto;
    min-width: 42px;
    max-width: 120px;
    height: 42px;
    min-height: 42px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    background: #ffffff;
    padding: 2px 4px;
    box-sizing: border-box;
    cursor: pointer;
    user-select: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }

  .topbar-logo-container:hover {
    transform: scale(1.05);
    box-shadow: 0 3px 12px rgba(217, 119, 6, 0.45);
    filter: brightness(1.02);
  }

  .topbar-logo-container:active {
    transform: scale(0.96);
  }

  .topbar-logo-container svg,
  .topbar-logo-container img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }

  .ae-badge {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #070d18;
    font-weight: 900;
    font-size: 15px;
    padding: 6px 11px;
    border-radius: var(--radius-sm);
    letter-spacing: 0.5px;
    box-shadow: 0 2px 8px rgba(245, 158, 11, 0.35);
    flex-shrink: 0;
  }

  .brand-title {
    font-size: 15px;
    font-weight: 900;
    color: #ffffff !important;
    letter-spacing: 0.5px;
    line-height: 1.2;
    text-transform: uppercase;
  }

  .brand-subtitle {
    font-size: 11.5px;
    color: #94a3b8 !important;
    margin-top: 2px;
    font-weight: 500;
  }

  .btn-topbar-settings {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-md);
    background: #111c30 !important;
    border: 1.5px solid #2e4369 !important;
    color: #94a3b8 !important;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .btn-topbar-settings:hover {
    color: #f59e0b !important;
    border-color: #f59e0b !important;
    background: rgba(245, 158, 11, 0.15) !important;
    transform: rotate(30deg);
  }

  /* TAB NAVIGASI: DIKUNCI KE WARNA GELAP DENGAN GARIS PEMISAH & BORDER BAWAH LEBIH TEGAS */
  .nav-tabs-wrapper {
    position: -webkit-sticky;
    position: sticky;
    top: var(--topbar-height);
    z-index: 190;
    width: 100%;
    max-width: 100vw !important;
    background-color: #070d18 !important;
    border-bottom: 2.5px solid #2e4369 !important;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain !important;
    overscroll-behavior: contain !important;
    touch-action: pan-x pan-y !important;
    box-sizing: border-box;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }

  .nav-tabs-wrapper::-webkit-scrollbar {
    display: none;
  }

  .nav-tabs {
    display: flex;
    padding: 0 16px;
    gap: 0;
    min-width: max-content;
    box-sizing: border-box;
  }

  .nav-item {
    padding: 13px 18px;
    font-size: 12px;
    font-weight: 800;
    color: #94a3b8 !important;
    cursor: pointer;
    border-bottom: 3.5px solid transparent;
    border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
    transition: all 0.2s ease;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    user-select: none;
    white-space: nowrap;
  }

  .nav-item:first-child {
    border-left: 1px solid rgba(255, 255, 255, 0.08) !important;
  }

  .nav-item:hover {
    color: #ffffff !important;
    background: rgba(255, 255, 255, 0.06) !important;
  }

  .nav-item.active {
    color: #f59e0b !important;
    border-bottom-color: #f59e0b !important;
    background: rgba(245, 158, 11, 0.16) !important;
  }

  /* HIDDEN GATEWAY: SEMBUNYIKAN TAB PRODUKTIVITAS MEKANIK DARI NAVBAR */
  #nav-item-productivity {
    display: none !important;
  }

  /* CONTAINER APLIKASI: RIGID BOUNDS */
  .app-container {
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    padding: 20px 16px 60px 16px;
    box-sizing: border-box;
    overflow-x: hidden !important;
  }

  .tab-content {
    display: none;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    overflow-x: hidden !important;
  }

  .tab-content.active {
    display: block;
    animation: fadeInTab 0.2s ease;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    overflow-x: hidden !important;
  }

  @keyframes fadeInTab {
    from {
      opacity: 0;
      transform: translateY(3px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* KARTU KONTEN DENGAN GARIS TEPI (BORDER) DIPERJELAS & SOLID */
  .card {
    background-color: var(--card-bg) !important;
    border: 1.5px solid var(--border-card) !important;
    border-radius: var(--radius-lg);
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: var(--card-shadow);
    transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    overflow: hidden !important;
  }

  .card-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1.5px solid var(--border-color) !important;
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
  }

  .form-header-box {
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1.5px solid var(--border-color) !important;
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
  }

  .form-main-heading {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-main) !important;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  .form-sub-heading {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 3px;
    line-height: 1.35;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 12px;
    margin-bottom: 16px;
    width: 100%;
    box-sizing: border-box;
  }

  #tab-dashboard .metrics-grid {
    grid-template-columns: repeat(8, 1fr);
  }

  @media (max-width: 1280px) {
    #tab-dashboard .metrics-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  /* KARTU METRIK DENGAN GARIS TEPI DIPERJELAS */
  .metric-card {
    background: var(--card-bg) !important;
    border: 1.5px solid var(--border-card) !important;
    border-radius: var(--radius-md);
    padding: 14px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    user-select: none;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  .metric-card:hover {
    border-color: var(--accent-orange) !important;
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
  }

  .metric-card:active {
    transform: translateY(-1px);
  }

  .metric-value {
    font-size: 16px;
    font-weight: 900;
    color: var(--text-main);
    letter-spacing: 0.3px;
    line-height: 1.1;
  }

  .metric-value.kpi {
    color: var(--accent-green) !important;
  }

  .metric-label {
    font-size: 9px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    line-height: 1.3;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
    min-width: 0 !important;
  }

  .form-group.full-width {
    grid-column: 1 / -1;
  }

  label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-main);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  /* INPUT & SELECT: RIGID BOUNDS */
  input,
  select,
  textarea {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    background-color: var(--input-bg) !important;
    border: 1.5px solid var(--input-border) !important;
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    color: var(--text-main) !important;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    box-sizing: border-box !important;
    display: block;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--accent-orange) !important;
    box-shadow: 0 0 0 3px var(--accent-orange-light);
  }

  textarea {
    resize: vertical;
    min-height: 70px;
  }

  input[type="date"],
  input[type="time"] {
    -webkit-appearance: none !important;
    appearance: none !important;
    cursor: pointer;
    color-scheme: light;
    min-height: 38px;
    line-height: 1.3;
  }

  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator {
    cursor: pointer;
    opacity: 0.6;
    padding: 2px;
  }

  input[type="date"]::-webkit-inner-spin-button,
  input[type="time"]::-webkit-inner-spin-button,
  input[type="date"]::-webkit-clear-button,
  input[type="time"]::-webkit-clear-button {
    display: none !important;
    -webkit-appearance: none !important;
  }

  .status-select-rfu {
    border: 1.5px solid rgba(5, 150, 105, 0.75) !important;
    color: #059669 !important;
    background-color: rgba(5, 150, 105, 0.08) !important;
    font-weight: 700 !important;
  }

  .status-select-continue {
    border: 1.5px solid rgba(217, 119, 6, 0.75) !important;
    color: #d97706 !important;
    background-color: rgba(217, 119, 6, 0.08) !important;
    font-weight: 700 !important;
  }

  .status-select-waiting {
    border: 1.5px solid rgba(220, 38, 38, 0.75) !important;
    color: #dc2626 !important;
    background-color: rgba(220, 38, 38, 0.08) !important;
    font-weight: 700 !important;
  }

  .multi-photo-uploader {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    margin-top: 4px;
    box-sizing: border-box;
  }

  .multi-photo-dropzone {
    border: 2px dashed var(--border-card) !important;
    border-radius: var(--radius-md);
    background: var(--card-bg-subtle);
    padding: 16px 20px;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s ease;
    user-select: none;
    box-sizing: border-box;
    width: 100%;
  }

  .multi-photo-dropzone:hover {
    border-color: var(--accent-orange) !important;
    background: var(--accent-orange-light);
  }

  .multi-photo-icon {
    font-size: 22px;
    color: var(--accent-orange);
  }

  .multi-photo-label {
    font-size: 11.5px;
    font-weight: 800;
    color: var(--text-main);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .multi-photo-hint {
    font-size: 10.5px;
    color: var(--text-muted);
  }

  .multi-photo-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    width: 100%;
    margin-top: 6px;
    box-sizing: border-box;
  }

  .multi-photo-card {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--card-bg-subtle);
    border: 1.5px solid var(--border-card) !important;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    transition: transform 0.15s ease, border-color 0.15s ease;
    box-sizing: border-box;
  }

  .multi-photo-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent-orange) !important;
  }

  .multi-photo-thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: #0f172a;
  }

  .multi-photo-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: pointer;
  }

  .multi-photo-caption-box {
    padding: 6px;
    background: #ffffff;
    border-top: 1px solid var(--border-card);
    box-sizing: border-box;
    width: 100%;
  }

  .multi-photo-caption-input {
    width: 100% !important;
    font-size: 11px !important;
    padding: 5px 7px !important;
    border: 1px solid #cbd5e1 !important;
    border-radius: 3px !important;
    color: #1e293b !important;
    background: #f8fafc !important;
    box-sizing: border-box !important;
    outline: none !important;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  .multi-photo-caption-input:focus {
    border-color: var(--accent-orange) !important;
    background: #ffffff !important;
    box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2) !important;
  }

  .multi-photo-btn-delete {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(220, 38, 38, 0.92);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    line-height: 1;
    z-index: 10;
    transition: all 0.15s ease;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
  }

  .multi-photo-btn-delete:hover {
    background: #b91c1c;
    transform: scale(1.15);
  }

  .multi-photo-badge-idx {
    position: absolute;
    bottom: 5px;
    left: 5px;
    background: rgba(15, 23, 42, 0.85);
    color: #ffffff;
    border: 1px solid var(--border-card);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.3px;
    pointer-events: none;
  }

  .btn-submit {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #ffffff;
    border: 1px solid #b45309;
    border-radius: var(--radius-sm);
    padding: 10px 20px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 8px rgba(217, 119, 6, 0.25);
    box-sizing: border-box;
  }

  .btn-submit:hover {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    transform: translateY(-1px);
  }

  .btn-submit:disabled,
  .btn-submit.btn-loading {
    opacity: 0.82 !important;
    cursor: not-allowed !important;
    transform: none !important;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15) !important;
    pointer-events: none !important;
    transition: all 0.1s ease !important;
  }

  .btn-secondary {
    background: #ffffff;
    border: 1.5px solid var(--border-card) !important;
    color: var(--text-main);
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    box-sizing: border-box;
  }

  .btn-secondary:hover {
    border-color: var(--text-muted) !important;
    background: #f1f5f9;
  }

  .btn-export-pdf {
    background: rgba(220, 38, 38, 0.1);
    color: #dc2626;
    border: 1.5px solid rgba(220, 38, 38, 0.45) !important;
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
    box-sizing: border-box;
  }

  .btn-export-pdf:hover {
    background: rgba(220, 38, 38, 0.2);
  }

  /* SUB-NAVIGASI MENU DENGAN GARIS TEPI SOLID */
  .subnav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg) !important;
    border: 1.5px solid var(--border-card) !important;
    border-radius: var(--radius-md);
    padding: 8px 12px;
    margin-bottom: 14px;
    gap: 10px;
    flex-wrap: wrap;
    box-shadow: var(--card-shadow);
    transition: background-color 0.25s ease, border-color 0.25s ease;
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
    overflow: hidden !important;
  }

  .subnav-pill-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    box-sizing: border-box;
    min-width: 0;
  }

  .subnav-pill {
    background: var(--card-bg-subtle);
    border: 1.5px solid var(--border-card) !important;
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    padding: 7px 12px;
    font-size: 11.5px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
    text-transform: uppercase;
